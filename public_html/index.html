<style>
/* ── TGFM brand palette ──────────────────────────────────────────────────
   The supplied palette is the dark identity, kept exactly. The light theme
   is derived from it: the same navy becomes the type, the same steel holds
   the borders, and the gold darkens only where it has to carry text — the
   button gradient itself is identical in both, so the thing you press looks
   the same wherever you are.

   Three states to serve: an explicit choice stamps data-theme on <html>;
   the default "system" setting stamps nothing and only prefers-color-scheme
   separates the two. Components read tokens, never raw colour.
   ──────────────────────────────────────────────────────────────────────── */

/* Light — the default token set */
:root{
  --paper:#F3F6FB;        /* page ground, navy-biased white   */
  --surface:#FFFFFF;      /* cards, panels, rail              */
  --surface-2:#E9EEF7;    /* inputs, hovers                   */
  --surface-3:#DBE3F0;    /* chips, active rows               */
  --line:#D8E0EE;
  --line-strong:#B2BFD5;
  --steel:#42567A;        /* Steel Blue, darkened to hold on white */

  --ink:#0B1226;          /* Deep Midnight Navy becomes the type */
  --ink-soft:#25304A;
  --ink-mute:#5A6478;

  --brass:#8A5512;        /* gold, darkened only where it carries text */
  --brass-wash:#FBEBD4;
  --sage:#2F5B96;         /* Light Sky Blue, darkened for labels */
  --sage-wash:#E4ECF8;

  --good:#1C6F4E;  --good-wash:#DFF0E7;
  --warn:#8A6212;  --warn-wash:#FAECD2;
  --bad:#A32C3C;   --bad-wash:#FBE2E5;

  --shadow-sm:0 1px 2px rgba(11,18,38,.06), 0 2px 8px rgba(11,18,38,.05);
  --shadow-md:0 2px 4px rgba(11,18,38,.06), 0 12px 28px rgba(11,18,38,.10);
  --shadow-lg:0 8px 20px rgba(11,18,38,.10), 0 30px 60px rgba(11,18,38,.16);
  --glow:0 0 0 1px rgba(255,179,92,.55), 0 8px 22px rgba(255,179,92,.35);

  /* The button gradient is brand-fixed: identical in both themes, always
     read with navy type on top. */
  --grad-1:#FFB35C;       /* Golden Orange */
  --grad-2:#FFBE6F;       /* Warm Apricot  */
  --grad-3:#FFCE87;       /* Soft Peach    */
  --on-brass:#0B1226;

  --r-sm:5px; --r-md:9px; --r-lg:14px; --r-xl:22px;
  --rail:252px;

  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
}
/* Dark — the supplied TGFM palette, kept exactly.

   Two blocks, because the viewer has three states. The media query serves the
   default "system" setting, which stamps nothing on <html>; it is guarded so an
   explicit light choice still wins on a dark OS. The [data-theme="dark"] block
   serves the explicit choice. Only tokens are redefined — never components. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1226;        /* Deep Midnight Navy  */
    --surface:#0C132A;      /* Dark Navy Variation */
    --surface-2:#141C38;
    --surface-3:#1C2749;
    --line:#1E2A4D;
    --line-strong:#2F416D;
    --steel:#587097;        /* Steel Blue */

    --ink:#FFFFFF;          /* Pure White  */
    --ink-soft:#DDDEE0;     /* Soft Gray   */
    --ink-mute:#9497A1;     /* Muted Gray  */

    --brass:#FFB35C;        /* Golden Orange carries text directly on navy */
    --brass-wash:#1F2745;
    --sage:#8EB3E7;         /* Light Sky Blue */
    --sage-wash:#16213E;

    --good:#5CC79A;  --good-wash:#0F2A22;
    --warn:#E8B25C;  --warn-wash:#2A2113;
    --bad:#E8737A;   --bad-wash:#2B1620;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.28);
    --shadow-md:0 2px 4px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.42);
    --shadow-lg:0 8px 20px rgba(0,0,0,.45), 0 30px 60px rgba(0,0,0,.55);
    --glow:0 0 0 1px rgba(255,179,92,.25), 0 8px 26px rgba(255,179,92,.18);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1226; --surface:#0C132A; --surface-2:#141C38; --surface-3:#1C2749;
  --line:#1E2A4D; --line-strong:#2F416D; --steel:#587097;
  --ink:#FFFFFF; --ink-soft:#DDDEE0; --ink-mute:#9497A1;
  --brass:#FFB35C; --brass-wash:#1F2745;
  --sage:#8EB3E7; --sage-wash:#16213E;
  --good:#5CC79A;  --good-wash:#0F2A22;
  --warn:#E8B25C;  --warn-wash:#2A2113;
  --bad:#E8737A;   --bad-wash:#2B1620;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.28);
  --shadow-md:0 2px 4px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.42);
  --shadow-lg:0 8px 20px rgba(0,0,0,.45), 0 30px 60px rgba(0,0,0,.55);
  --glow:0 0 0 1px rgba(255,179,92,.25), 0 8px 26px rgba(255,179,92,.18);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:15.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased; font-synthesis-weight:none;
}
img,svg{max-width:100%}
/* default size for inline icons that no component rule claims */
svg:not([class]){width:1em; height:1em; flex:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:400; letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:3px}
::selection{background:var(--brass); color:var(--on-brass)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}
}

/* type roles */
.display{font-family:var(--f-display); font-weight:400; line-height:1.06; letter-spacing:-.02em}
.serif{font-family:var(--f-display)}
.eyebrow{
  font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--sage);
}
.lede{font-family:var(--f-display); font-size:1.22rem; line-height:1.55; color:var(--ink-soft); font-weight:300}
.muted{color:var(--ink-mute)}
.num{font-variant-numeric:tabular-nums}

/* ── primitives ─────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  padding:.62em 1.05em; border-radius:var(--r-md); border:1px solid transparent;
  background:var(--surface-2); color:var(--ink); font-size:.9rem; font-weight:600;
  cursor:pointer; text-decoration:none; white-space:nowrap;
  transition:background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:1.05em;height:1.05em;flex:none}
.btn--primary{
  background:linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 55%, var(--grad-3) 100%);
  color:var(--on-brass); font-weight:700; box-shadow:var(--shadow-sm);
}
.btn--primary:hover{
  background:linear-gradient(135deg, var(--grad-2) 0%, var(--grad-3) 55%, var(--grad-3) 100%);
  box-shadow:var(--glow);
}
.btn--ghost{background:transparent; border-color:var(--steel); color:var(--ink-soft)}
.btn--ghost:hover{background:var(--surface-2); border-color:var(--sage); color:var(--ink)}
.btn--quiet{background:transparent; color:var(--ink-mute); padding:.45em .6em}
.btn--quiet:hover{background:var(--surface-2); color:var(--ink)}
.btn--danger{background:transparent; border-color:var(--line-strong); color:var(--bad)}
.btn--danger:hover{background:var(--bad-wash); border-color:var(--bad)}
.btn--sm{padding:.42em .75em; font-size:.8rem}
.btn--lg{padding:.8em 1.5em; font-size:.98rem}
.btn--block{width:100%}
.btn[disabled]{opacity:.5; pointer-events:none}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);
}
.pad{padding:20px}
.stack{display:flex; flex-direction:column}
.row{display:flex; align-items:center}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}
.gap-14{gap:14px}.gap-16{gap:16px}.gap-18{gap:18px}
.gap-20{gap:20px}.gap-24{gap:24px}.gap-32{gap:32px}.gap-40{gap:40px}
.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1 1 auto; min-width:0}

.pill{
  display:inline-flex; align-items:center; gap:.4em;
  padding:.24em .62em; border-radius:99px; font-size:11px; font-weight:600;
  letter-spacing:.05em; text-transform:uppercase; white-space:nowrap;
}
.pill svg{width:12px;height:12px}
.pill--brass{background:var(--brass-wash); color:var(--brass)}
.pill--sage{background:var(--sage-wash); color:var(--sage)}
.pill--good{background:var(--good-wash); color:var(--good)}
.pill--warn{background:var(--warn-wash); color:var(--warn)}
.pill--bad{background:var(--bad-wash); color:var(--bad)}
.pill--mute{background:var(--surface-2); color:var(--ink-mute)}

.field{display:flex; flex-direction:column; gap:6px}
.field > label{font-size:12.5px; font-weight:600; color:var(--ink-soft); letter-spacing:.01em}
.field .hint{font-size:12px; color:var(--ink-mute)}
.input, .select, .textarea{
  width:100%; padding:.62em .75em; background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line-strong); border-radius:var(--r-md);
  font-size:.92rem; transition:border-color .15s ease, background .15s ease;
}
.input:focus, .select:focus, .textarea:focus{outline:none; border-color:var(--brass); background:var(--surface-2)}
.textarea{resize:vertical; min-height:88px; line-height:1.55}
.select{appearance:none; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%, calc(100% - 12px) 52%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px;
}

.divider{height:1px; background:var(--line); border:0; margin:0}
.rule-label{display:flex; align-items:center; gap:14px; color:var(--ink-mute)}
.rule-label::after{content:""; flex:1; height:1px; background:var(--line)}

.progress{height:5px; background:var(--surface-3); border-radius:99px; overflow:hidden}
.progress > i{display:block; height:100%; border-radius:99px; transition:width .5s ease;
  background:linear-gradient(90deg, var(--grad-1) 0%, var(--grad-3) 100%)}
.progress--brass > i{background:var(--sage)}

/* thumbnails: generated, never fetched */
.thumb{
  position:relative; aspect-ratio:16/9; border-radius:var(--r-md); overflow:hidden;
  background:var(--surface-2); display:grid; place-items:center; isolation:isolate;
}
.thumb canvas{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.thumb .thumb-mark{
  position:absolute; z-index:1; left:12px; top:9px;
  font-family:var(--f-display); font-size:15px; font-weight:500; letter-spacing:.14em;
  color:rgba(255,255,255,.82); text-shadow:0 1px 10px rgba(0,0,0,.5);
}
.thumb .dur{
  position:absolute; z-index:2; right:7px; bottom:7px; background:rgba(11,18,38,.86); color:#DDDEE0;
  font-size:11px; font-weight:600; padding:1px 6px; border-radius:4px; font-variant-numeric:tabular-nums;
}
.thumb .lockbox{
  position:absolute; z-index:2; inset:0; display:grid; place-items:center;
  background:rgba(11,18,38,.62); backdrop-filter:blur(2px);
}
.thumb .lockbox svg{width:22px;height:22px;color:var(--brass)}
.thumb .playglyph{
  position:absolute; z-index:2; inset:0; margin:auto; width:46px; height:46px; border-radius:99px;
  background:linear-gradient(135deg, var(--grad-1), var(--grad-3)); color:var(--on-brass); display:grid; place-items:center;
  transition:transform .18s ease, background .18s ease;
}
.thumb .playglyph svg{width:17px;height:17px;margin-left:2px}
a:hover .thumb .playglyph, button:hover .thumb .playglyph{transform:scale(1.09); box-shadow:var(--glow)}
/* ── marketing shell ────────────────────────────────────── */
.mk{min-height:100vh; display:flex; flex-direction:column}
.mk-nav{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  border-bottom:1px solid var(--line);
}
.mk-nav .inner{max-width:1180px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:28px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; flex:none}
.brand .sigil{
  width:38px; height:38px; border-radius:99px; flex:none; display:block; object-fit:cover;
  box-shadow:0 0 0 1px var(--line-strong), 0 2px 10px rgba(0,0,0,.45);
}
.brand:hover .sigil{box-shadow:0 0 0 1px var(--brass), 0 2px 14px rgba(255,179,92,.28)}
.brand .wordmark{display:flex; flex-direction:column; line-height:1.05}
.brand .wordmark b{font-family:var(--f-ui); font-weight:700; font-size:17px; letter-spacing:.02em; color:var(--ink)}
.brand .wordmark span{font-size:9.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--sage)}
.mk-links{display:flex; gap:4px; margin-left:auto}
.mk-links a{
  padding:.45em .8em; border-radius:var(--r-sm); text-decoration:none; font-size:.88rem;
  font-weight:500; color:var(--ink-soft);
}
.mk-links a:hover{background:var(--surface-2); color:var(--sage)}
.mk-main{flex:1}
.shell{max-width:1180px; margin:0 auto; padding:0 24px; width:100%}
.mk-foot{border-top:1px solid var(--line); background:var(--surface); margin-top:auto}
.mk-foot .inner{max-width:1180px; margin:0 auto; padding:40px 24px; display:flex; flex-wrap:wrap; gap:32px; justify-content:space-between}

/* hero */
.hero{position:relative; overflow:hidden; border-bottom:1px solid var(--line)}
.hero canvas{position:absolute; inset:0; width:100%; height:100%; opacity:.85}
.hero-in{position:relative; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:56px; align-items:center; padding:76px 0 84px}
.hero h1{font-family:var(--f-display); font-size:clamp(2.7rem,6vw,4.3rem); line-height:1.02; letter-spacing:-.028em}
.hero h1 em{font-style:italic; font-weight:400;
  background:linear-gradient(100deg, var(--grad-1), var(--grad-3));
  -webkit-background-clip:text; background-clip:text; color:transparent}
.hero .lede{max-width:34ch; margin-top:18px}
.hero-cta{display:flex; flex-wrap:wrap; gap:10px; margin-top:28px}
.hero-proof{display:flex; gap:28px; margin-top:36px; padding-top:24px; border-top:1px solid var(--line)}
.hero-proof b{display:block; font-family:var(--f-display); font-size:1.75rem; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--brass)}
.hero-proof span{font-size:12px; color:var(--ink-mute)}

.hero-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg); padding:14px; transform:rotate(-.5deg);
}
.hero-card .meta{display:flex; align-items:center; gap:10px; padding:12px 8px 4px}

/* sections */
.sec{padding:76px 0; border-bottom:1px solid var(--line)}
.sec--tint{background:linear-gradient(180deg, var(--surface) 0%, var(--paper) 100%)}
.sec-head{max-width:62ch; margin-bottom:36px}
.sec-head h2{font-family:var(--f-display); font-size:clamp(1.85rem,3.4vw,2.5rem); line-height:1.12; letter-spacing:-.02em; margin-top:10px; color:var(--ink)}
.sec-head p{margin-top:14px; color:var(--ink-soft); max-width:58ch}

.path{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.path-step{background:var(--surface); padding:24px}
.path-step .n{font-family:var(--f-display); font-size:1.6rem; color:var(--brass); line-height:1}
.path-step h3{font-size:1rem; font-weight:600; margin:12px 0 6px}
.path-step p{font-size:.88rem; color:var(--ink-mute); line-height:1.55}

.track-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:20px}
.track-card{
  display:flex; flex-direction:column; text-decoration:none; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-sm);
  transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;
}
.track-card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:var(--line-strong)}
.track-card .thumb{border-radius:0}
.track-card .body{padding:16px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1}
.track-card h3{font-family:var(--f-display); font-size:1.24rem; line-height:1.2; letter-spacing:-.015em}
.track-card p{font-size:.85rem; color:var(--ink-mute); line-height:1.5}
.track-card .foot{margin-top:auto; padding-top:10px; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-mute)}

/* pricing */
.plans{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:20px; align-items:start}
.plan{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:26px 22px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow-sm);
}
.plan--feature{border-color:var(--brass); box-shadow:var(--glow), var(--shadow-md); position:relative}
.plan--feature::before{
  content:"Most chosen"; position:absolute; top:-10px; left:22px; color:var(--on-brass);
  background:linear-gradient(135deg, var(--grad-1), var(--grad-3));
  font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:3px 9px; border-radius:99px;
}
.plan h3{font-family:var(--f-display); font-size:1.5rem; letter-spacing:-.015em}
.plan .price{display:flex; align-items:baseline; gap:5px; font-variant-numeric:tabular-nums}
.plan .price b{font-family:var(--f-display); font-size:2.5rem; font-weight:400; line-height:1; letter-spacing:-.03em; color:var(--brass)}
.plan .price span{font-size:.85rem; color:var(--ink-mute)}
.plan ul{display:flex; flex-direction:column; gap:9px; font-size:.88rem; color:var(--ink-soft)}
.plan li{display:flex; gap:9px; align-items:flex-start; line-height:1.45}
.plan li svg{width:15px; height:15px; flex:none; margin-top:3px; color:var(--sage)}
.plan li.off{color:var(--ink-mute)}
.plan li.off svg{color:var(--line-strong)}
.toggle{display:inline-flex; background:var(--surface-2); border-radius:99px; padding:3px; gap:2px}
.toggle button{
  border:0; background:transparent; padding:.4em .95em; border-radius:99px; font-size:.83rem;
  font-weight:600; color:var(--ink-mute); cursor:pointer;
}
.toggle button[aria-pressed="true"]{background:var(--surface-3); color:var(--ink); box-shadow:var(--shadow-sm)}

/* auth */
.auth-wrap{display:grid; place-items:center; padding:56px 24px; min-height:calc(100vh - 200px)}
.auth{width:100%; max-width:400px; display:flex; flex-direction:column; gap:18px}
.auth-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:28px; box-shadow:var(--shadow-md); display:flex; flex-direction:column; gap:16px}
.demo-keys{display:flex; flex-direction:column; gap:8px}
.demo-key{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 13px;
  transition:border-color .15s ease, background .15s ease;
}
.demo-key:hover{border-color:var(--brass); background:var(--surface-3)}
.demo-key .av{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;flex:none;
  font-size:12px; font-weight:700; background:var(--surface-3); color:var(--ink-soft)}
.demo-key svg{width:15px; height:15px; flex:none; color:var(--ink-mute)}
.demo-key b{display:block; font-size:.87rem}
.demo-key small{color:var(--ink-mute); font-size:11.5px}

/* ── about ──────────────────────────────────────────────── */
.about-head{display:flex; align-items:center; gap:36px; flex-wrap:wrap}
.about-mark{
  width:210px; height:210px; flex:none; border-radius:99px; display:block;
  box-shadow:0 0 0 1px var(--line-strong), 0 18px 50px rgba(0,0,0,.55);
}
.teachers{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; margin-top:38px}
.teacher-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:22px; box-shadow:var(--shadow-sm);
}
.teacher-card h3{color:var(--brass)}
@media (max-width:640px){
  .about-head{gap:22px}
  .about-mark{width:140px; height:140px}
}
/* ── application shell ──────────────────────────────────── */
.app{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}
.rail{
  position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--surface);
  border-right:1px solid var(--line); display:flex; flex-direction:column; gap:6px; padding:16px 12px;
}
.rail .brand{padding:6px 8px 14px}
.rail-group{margin-top:14px}
.rail-group > .eyebrow{padding:0 10px 8px}
.rail a.nav, .rail button.nav{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
  padding:.55em .65em; border:0; background:transparent; border-radius:var(--r-md);
  font-size:.885rem; font-weight:500; color:var(--ink-soft); text-decoration:none;
  transition:background .14s ease, color .14s ease;
}
.rail .nav svg{width:16px; height:16px; flex:none; color:var(--steel)}
.rail .nav:hover{background:var(--surface-2); color:var(--ink)}
.rail .nav[aria-current="page"]{background:var(--surface-3); color:var(--ink); font-weight:600;
  box-shadow:inset 2px 0 0 var(--brass)}
.rail .nav[aria-current="page"] svg{color:var(--brass)}
.rail .nav .tally{margin-left:auto; font-size:11px; color:var(--ink-mute); font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}

.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:12px 28px; border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(12px);
}
.searchbox{position:relative; flex:1; max-width:400px}
.searchbox svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-mute)}
.searchbox input{padding-left:33px}
.avatar{
  width:31px; height:31px; border-radius:99px; display:grid; place-items:center; flex:none;
  background:var(--surface-3); color:var(--sage); font-size:11.5px; font-weight:700;
  box-shadow:inset 0 0 0 1px var(--line-strong);
}
.page{padding:30px 28px 72px; max-width:1240px}
.page-head{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:26px}
.page-head h1{font-family:var(--f-display); font-size:clamp(1.7rem,3vw,2.2rem); letter-spacing:-.022em; line-height:1.1}
.page-head p{color:var(--ink-mute); font-size:.92rem; margin-top:5px}
.page-head .actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px; display:flex; flex-direction:column; gap:4px}
.stat .k{font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-mute)}
.stat .v{font-family:var(--f-display); font-size:2.05rem; line-height:1.1; font-variant-numeric:tabular-nums; letter-spacing:-.025em; color:var(--brass)}
.stat .d{font-size:12px; color:var(--ink-mute)}
.stat .d.up{color:var(--good)} .stat .d.down{color:var(--bad)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.panel-head{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line)}
.panel-head h2{font-size:.95rem; font-weight:600; letter-spacing:-.005em}
.panel-head .actions{margin-left:auto; display:flex; gap:6px}
.panel-body{padding:18px}
.panel-body--flush{padding:0}

table{width:100%; border-collapse:collapse; font-size:.885rem}
th{
  text-align:left; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-mute); padding:10px 18px; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:12px 18px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}
.who{display:flex; align-items:center; gap:10px}
.who b{font-weight:600; display:block; line-height:1.3}
.who small{color:var(--ink-mute); font-size:11.5px}

/* lesson list */
.lessons{display:flex; flex-direction:column}
.lesson{
  display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--line);
  text-decoration:none; cursor:pointer; background:transparent; border-left:0; border-right:0; border-top:0;
  width:100%; text-align:left; transition:background .14s ease;
}
.lesson:last-child{border-bottom:0}
.lesson:hover{background:var(--surface-2)}
.lesson .idx{
  width:26px; height:26px; border-radius:99px; flex:none; display:grid; place-items:center;
  font-size:11.5px; font-weight:700; background:var(--surface-3); color:var(--sage); font-variant-numeric:tabular-nums;
}
.lesson.done .idx{background:var(--good-wash); color:var(--good)}
.lesson.locked{opacity:.62}
.lesson .t{flex:1; min-width:0}
.lesson .t b{display:block; font-weight:600; font-size:.9rem; line-height:1.35}
.lesson .t small{color:var(--ink-mute); font-size:11.5px}
.lesson .meta{display:flex; align-items:center; gap:10px; flex:none; color:var(--ink-mute); font-size:12px}
.lesson .meta svg{width:14px;height:14px}

/* watch */
.watch{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:26px; align-items:start}
.player{
  position:relative; aspect-ratio:16/9; border-radius:var(--r-lg); overflow:hidden;
  background:#060B18; border:1px solid var(--line); box-shadow:var(--shadow-md);
}
.player iframe{position:absolute; inset:0; width:100%; height:100%; border:0; z-index:2}
.player .poster{position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; background:transparent; cursor:pointer; z-index:1}
.player .poster .thumb{width:100%; height:100%; aspect-ratio:auto; border-radius:0}
.player-note{margin-top:9px; font-size:12px; color:var(--ink-mute); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.player-note svg{width:14px; height:14px; flex:none}
.player-note a{color:var(--brass); text-decoration:none; font-weight:600}
.player-note a:hover{text-decoration:underline}
.notes-area{display:flex; flex-direction:column; gap:10px}
.paywall{
  display:grid; place-items:center; text-align:center; aspect-ratio:16/9; border-radius:var(--r-lg);
  border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow-sm); padding:26px;
}
.paywall .inner{max-width:38ch; display:flex; flex-direction:column; gap:12px; align-items:center}
.paywall .inner > svg{width:26px; height:26px; color:var(--ink-mute)}
.paywall h3{font-family:var(--f-display); font-size:1.6rem; letter-spacing:-.02em}

/* modal */
.modal-scrim{
  position:fixed; inset:0; z-index:80; background:rgba(4,8,18,.72); backdrop-filter:blur(3px);
  display:grid; place-items:center; padding:24px; overflow-y:auto;
}
.modal{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
}
.modal-head{display:flex; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2}
.modal-head h2{font-family:var(--f-display); font-size:1.3rem; letter-spacing:-.018em}
.modal-body{padding:22px; display:flex; flex-direction:column; gap:16px}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}

/* toast */
.toasts{position:fixed; z-index:90; bottom:22px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  background:var(--surface-3); color:var(--ink); padding:.6em 1.05em; border-radius:99px;
  box-sizing:border-box; border:1px solid var(--line-strong);
  font-size:.85rem; font-weight:600; box-shadow:var(--shadow-lg); animation:rise .25s ease both;
}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

.empty{display:flex; flex-direction:column; align-items:center; gap:10px; padding:52px 24px; text-align:center; color:var(--ink-mute)}
.empty svg{width:26px; height:26px; opacity:.6}

.mobile-only{display:none}
@media (max-width:960px){
  .hero-in{grid-template-columns:1fr; gap:36px; padding:52px 0 60px}
  .watch{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .rail{position:fixed; z-index:60; width:var(--rail); transform:translateX(-100%); transition:transform .22s ease; box-shadow:var(--shadow-lg)}
  .app[data-rail="open"] .rail{transform:none}
  .mobile-only{display:inline-flex}
  .scrim{position:fixed; inset:0; z-index:50; background:rgba(4,8,18,.6)}
  .page{padding:22px 18px 64px}
  .topbar{padding:11px 18px}
  .shell{padding:0 18px}
}
@media (max-width:600px){
  .mk-links{display:none}
  .hero-proof{gap:20px; flex-wrap:wrap}
}
/* ── checkout ───────────────────────────────────────────── */
.checkout{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,360px); gap:24px; align-items:start}
.methods{display:flex; flex-direction:column; gap:10px}
.method{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
  background:var(--surface-2); border:1.5px solid var(--line); border-radius:var(--r-md); padding:13px 14px;
  transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
}
.method:hover{border-color:var(--line-strong)}
.method.is-on{border-color:var(--brass); background:var(--surface-3); box-shadow:var(--glow)}
.method b{display:block; font-size:.92rem}
.method small{color:var(--ink-mute); font-size:12px; line-height:1.35; display:block}
.method-mark{
  flex:none; display:grid; place-items:center; min-width:62px; height:34px; padding:0 10px;
  border-radius:6px; background:var(--brand,#444); color:#fff;
  font-size:13px; font-weight:700; letter-spacing:-.01em;
}
.method-tick{
  flex:none; width:20px; height:20px; border-radius:99px; display:grid; place-items:center;
  border:1.5px solid var(--line-strong); color:transparent;
}
.method-tick svg{width:12px; height:12px}
.method.is-on .method-tick{background:var(--brass); border-color:var(--brass); color:var(--on-brass)}

.notice{
  display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--r-md);
  background:var(--brass-wash); color:var(--ink-soft); font-size:.83rem; line-height:1.5;
  border:1px solid var(--line-strong);
}
.notice svg{width:16px; height:16px; flex:none; margin-top:2px; color:var(--brass)}
.notice code{background:var(--surface-3); color:var(--sage); padding:1px 5px; border-radius:4px; font-size:.9em}
/* The louder one: the backend was switched on and did not answer. */
.notice--bad{background:var(--bad-wash); border-color:var(--bad)}
.notice--bad svg{color:var(--bad)}

/* ── simulated gateway ──────────────────────────────────── */
.gateway{min-height:100vh; display:grid; place-items:center; padding:32px 20px; background:var(--paper)}
.gateway-card{
  width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); box-shadow:var(--shadow-lg); overflow:hidden;
}
.gateway-bar{display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line)}
.gateway-body{padding:24px 20px}

/* ── receipt ────────────────────────────────────────────── */
.receipt{
  max-width:520px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); box-shadow:var(--shadow-sm); overflow:hidden;
}
.receipt-top{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding:30px 24px 24px}
.receipt-top h2{font-size:1.55rem; letter-spacing:-.02em}
.receipt-top p{font-size:.88rem; max-width:38ch}
.receipt-top > svg{width:24px; height:24px; padding:8px; box-sizing:content-box; border-radius:99px}
.receipt-top.is-ok > svg{background:var(--good-wash); color:var(--good)}
.receipt-top.is-bad > svg{background:var(--bad-wash); color:var(--bad)}
/* Paid but not yet confirmed — neither good news nor bad. */
.receipt-top.is-wait > svg{background:var(--warn-wash); color:var(--warn)}
.receipt-rows{margin:0; border-top:1px dashed var(--line-strong)}
.rrow{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:11px 18px; border-bottom:1px solid var(--line)}
.rrow dt{font-size:.85rem; color:var(--ink-mute)}
.rrow dd{margin:0; font-size:.88rem; text-align:right}
.rrow code{background:var(--surface-3); color:var(--sage); padding:2px 6px; border-radius:4px; font-size:12.5px}

/* ── billing history ────────────────────────────────────── */
.sub-banner{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:16px 18px;
  border-radius:var(--r-md); background:var(--sage-wash); color:var(--ink);
  border:1px solid var(--line-strong);
}
.sub-banner.is-warn{background:var(--warn-wash)}
.sub-banner.is-off{background:var(--surface-2); color:var(--ink)}
.sub-banner .big{font-family:var(--f-display); font-size:1.35rem; line-height:1.15; letter-spacing:-.02em}
.sub-banner svg{width:20px; height:20px; flex:none}

@media (max-width:900px){ .checkout{grid-template-columns:1fr} }
@media print{
  .rail, .topbar, .page-head, .toasts{display:none !important}
  .app{grid-template-columns:1fr}
  .receipt{box-shadow:none; max-width:none}
}

/* pass swap links on the checkout summary */
.swap-pass{
  display:flex; align-items:center; gap:10px; text-decoration:none;
  padding:9px 11px; border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--surface-2); font-size:.85rem;
  transition:border-color .15s ease, background .15s ease;
}
.swap-pass:hover{border-color:var(--brass); background:var(--surface-3)}
.swap-pass b{display:block; font-weight:600}
.swap-pass small{color:var(--ink-mute); font-size:11.5px}
.swap-pass svg{width:14px; height:14px; color:var(--ink-mute)}
.plan--running{border-color:var(--sage); box-shadow:var(--shadow-md); position:relative}
.plan--running::before{
  content:"Running now"; position:absolute; top:-10px; left:22px; background:var(--sage); color:var(--surface);
  font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:3px 9px; border-radius:99px;
}

/* the "create your account" step on a receipt */
.setup-note{
  display:flex; gap:12px; align-items:flex-start; padding:16px 18px;
  background:var(--brass-wash); border-top:1px solid var(--line-strong); border-bottom:1px solid var(--line-strong);
}
.setup-note > svg{width:19px; height:19px; flex:none; margin-top:2px; color:var(--brass)}
.setup-note b{font-size:.95rem}

/* sandbox credential crib, only visible while SANDBOX_HELP is on */
.sandbox-help{
  border:1px dashed var(--warn); border-radius:var(--r-md);
  background:var(--warn-wash); padding:13px 15px;
}
.sandbox-help dl{margin:0; display:flex; flex-direction:column; gap:6px}
.sandbox-help dl > div{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:.8rem}
.sandbox-help dt{min-width:118px; color:var(--ink-soft); font-weight:600}
.sandbox-help dd{margin:0}
.sandbox-help code{background:var(--surface-3); color:var(--brass); padding:1px 6px; border-radius:4px; font-size:12px}

/* the one-off subscription, marked so it does not read as a cheap pass */
.plan--single{border-style:dashed}
.plan--single .price b{color:var(--brass)}

/* featured image control in the admin */
.imgfield{
  display:grid; grid-template-columns:minmax(0,180px) minmax(0,1fr); gap:14px; align-items:start;
  border:1px solid var(--line); border-radius:var(--r-md); padding:12px; background:var(--surface-2);
}
.imgfield-shot{
  width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:var(--r-sm);
  border:1px solid var(--line-strong); display:block;
}
.imgfield-empty{
  width:100%; aspect-ratio:16/9; border-radius:var(--r-sm); border:1px dashed var(--line-strong);
  display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:center;
  color:var(--ink-mute); font-size:11.5px; text-align:center; padding:8px;
}
.imgfield-empty svg{width:20px; height:20px}
@media (max-width:640px){ .imgfield{grid-template-columns:1fr} }
/* ══════════════════════════════════════════════════════════════════════════
   THE PUBLIC FACE

   The home page TGFM asked for, rebuilt in the site's own tokens rather than
   in Tailwind: one file still has to be one file, and a CDN that goes down
   must not be able to take the ministry's front door with it.

   Two things are deliberate here.

   The palette is not a translation — the reference design and this app were
   already drawn from the same six colours (navy #0B1226, steel #587097, sky
   #8EB3E7, gold #FFB35C), so every rule below reads a token and the page
   follows the viewer's light or dark setting for free. The navy sections stay
   navy in both, because they are meant to be the dark beat in the rhythm.

   And the type is scoped. Fraunces and Manrope belong to the marketing pages;
   the app and the admin keep Newsreader and Archivo, so a disciple reading a
   long teaching note is not handed a display face to read it in.
   ══════════════════════════════════════════════════════════════════════════ */

.mk{
  --f-display:"Fraunces","Newsreader","Iowan Old Style",Georgia,serif;
  --f-ui:"Manrope","Archivo","Helvetica Neue",Arial,sans-serif;
  font-family:var(--f-ui);
}

/* The two grounds the page alternates between. On a dark screen the light
   ground becomes the app's own paper, and the navy deepens a step so the
   sections still read as two different rooms.

   Declared on .mk as well as .lp: the header and footer use the same buttons,
   and a token that resolves to nothing turns a pill button into bare text. */
.mk, .lp{
  --lp-canvas:#F4F6FC;
  --lp-navy:#0C132A;
  --lp-navy-soft:#172240;
  --lp-on-navy:#FFFFFF;
  --lp-sky:#8EB3E7;
  --lp-steel:#587097;
  --lp-gold:#FFB35C;
  --lp-muted:#9497A1;
  --lp-ink:#0C132A;
  --lp-line:rgba(88,112,151,.28);
  --lp-card:#FFFFFF;
}
.lp{ background:var(--lp-canvas); color:var(--lp-ink) }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mk,
  :root:not([data-theme="light"]) .lp{
    --lp-canvas:#0B1226;
    --lp-navy:#070C1A;
    --lp-navy-soft:#111A33;
    --lp-ink:#FFFFFF;
    --lp-card:#0F1730;
    --lp-line:rgba(88,112,151,.36);
    --lp-muted:#9497A1;
  }
}
:root[data-theme="dark"] .mk,
:root[data-theme="dark"] .lp{
  --lp-canvas:#0B1226;
  --lp-navy:#070C1A;
  --lp-navy-soft:#111A33;
  --lp-ink:#FFFFFF;
  --lp-card:#0F1730;
  --lp-line:rgba(88,112,151,.36);
  --lp-muted:#9497A1;
}

.lp-shell{
  width:100%; max-width:1152px; margin-inline:auto;
  padding-inline:24px; position:relative;
}
@media (min-width:768px){ .lp-shell{ padding-inline:40px } }

.lp section{ position:relative; overflow:hidden }
.lp section[id]{ scroll-margin-top:92px }

.lp-dark{ background:var(--lp-navy); color:var(--lp-on-navy) }
.lp-light{ background:var(--lp-canvas); color:var(--lp-ink) }

/* the soft colour orbs behind the hero and the navy sections */
.lp-orbs{ position:absolute; inset:0; pointer-events:none; overflow:hidden }
.lp-orb{ position:absolute; border-radius:50%; filter:blur(120px) }

.lp-eyebrow{
  display:inline-flex; align-items:center; gap:12px;
  font-family:var(--f-ui); font-size:12.5px; font-weight:700;
  letter-spacing:.32em; text-transform:uppercase; color:var(--lp-steel);
}
.lp-eyebrow i{ display:block; height:1px; width:40px; background:var(--lp-gold); flex:none }
.lp-dark .lp-eyebrow{ color:var(--lp-gold) }
.lp-dark .lp-eyebrow i{ background:rgba(255,179,92,.7); width:32px }

.lp h1, .lp h2, .lp h3, .lp .lp-display{
  font-family:var(--f-display); font-optical-sizing:auto; letter-spacing:-.015em;
}
.lp h1{
  font-size:clamp(2.7rem, 6vw, 4.3rem); line-height:1.03; font-weight:400;
  color:var(--lp-ink); margin:0;
}
.lp h1 em{ font-style:italic; color:var(--lp-steel) }
.lp h2{
  font-size:clamp(2rem, 4.2vw, 3rem); line-height:1.08; font-weight:400;
  color:var(--lp-ink); margin:0;
}
.lp h3{ font-family:var(--f-display); font-weight:600; letter-spacing:-.01em; margin:0 }
/* After the three above, not before: a navy section has to win the colour, and
   these carry the same specificity. */
.lp-dark h1, .lp-dark h2, .lp-dark h3{ color:var(--lp-on-navy) }
.lp p{ margin:0 }
.lp-muted{ color:var(--lp-muted); line-height:1.7 }
.lp-dark .lp-muted{ color:rgba(142,179,231,.8) }

/* ── buttons ─────────────────────────────────────────────────────────────
   The gradient is brand-fixed and always carries navy type, so the thing you
   press looks the same on every screen and in either theme. */
.lp-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:40px; padding:0 20px; border-radius:999px; border:0; cursor:pointer;
  font-family:var(--f-ui); font-size:.875rem; font-weight:600; white-space:nowrap;
  text-decoration:none; transition:box-shadow .3s, filter .3s, background .3s, border-color .3s, transform .1s;
}
.lp-btn svg{ width:16px; height:16px; flex:none }
.lp-btn:active{ transform:scale(.98) }
.lp-btn--sm{ height:36px; padding:0 16px; font-size:.8125rem }
.lp-btn--lg{ height:48px; padding:0 32px; font-size:.9375rem }
.lp-btn--xl{ height:56px; padding:0 36px; font-size:1rem }
.lp-btn--gold{
  background-image:linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 50%, var(--grad-3) 100%);
  color:#0C132A; box-shadow:0 14px 34px -12px rgba(255,179,92,.55);
}
.lp-btn--gold:hover{ box-shadow:0 20px 44px -14px rgba(255,179,92,.7); filter:brightness(1.05) }
.lp-dark .lp-btn--gold{ box-shadow:0 0 70px -10px rgba(255,179,92,.35) }
.lp-dark .lp-btn--gold:hover{ filter:brightness(1.1); box-shadow:0 20px 44px -14px rgba(255,179,92,.7) }
.lp-btn--wire{
  border:1px solid var(--lp-line); background:color-mix(in srgb, var(--lp-card) 60%, transparent);
  color:var(--lp-ink);
}
.lp-btn--wire:hover{ border-color:var(--lp-steel); background:var(--lp-card) }

/* ── scroll reveal ─────────────────────────────────────────────────────── */
.lp-in{ opacity:0; transform:translateY(28px);
  transition:opacity .7s cubic-bezier(.21,.47,.32,.98), transform .7s cubic-bezier(.21,.47,.32,.98) }
.lp-in.is-on{ opacity:1; transform:none }
@media (prefers-reduced-motion:reduce){
  .lp-in{ opacity:1; transform:none; transition:none }
  html{ scroll-behavior:auto }
}

/* ── 1. hero ─────────────────────────────────────────────────────────────── */
.lp-hero-in{
  display:grid; gap:64px; align-items:center;
  padding:56px 0 64px;
}
@media (min-width:1024px){
  .lp-hero-in{ grid-template-columns:1.05fr 1fr; gap:56px; padding:80px 0 96px }
}
.lp-hero-copy{ display:flex; flex-direction:column; align-items:flex-start; gap:24px }
.lp-hero-lede{ max-width:36rem }
.lp-hero-say{ font-family:var(--f-display); font-style:italic; font-size:clamp(1.35rem,2.6vw,1.7rem); color:var(--lp-ink); opacity:.85 }
.lp-hero-motto{ font-size:.875rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--lp-ink) }

.lp-hero-art{ position:relative; justify-self:stretch }
@media (min-width:1024px){ .lp-hero-art{ justify-self:end } }
.lp-hero-art::before{
  content:""; position:absolute; inset:-32px; z-index:0; border-radius:48px;
  background:linear-gradient(135deg, rgba(142,179,231,.4), transparent 55%, rgba(255,179,92,.3));
  filter:blur(32px);
}
.lp-hero-frame{
  position:relative; z-index:1; width:100%; max-width:540px; aspect-ratio:4/3;
  border-radius:32px; overflow:hidden; box-shadow:0 30px 60px -30px rgba(12,19,42,.5);
  outline:1px solid rgba(12,19,42,.1); outline-offset:-1px; background:var(--lp-navy);
}
.lp-hero-frame img, .lp-hero-frame canvas{ width:100%; height:100%; object-fit:cover; display:block }
.lp-hero-mark{
  position:absolute; inset:0; display:grid; place-items:center; gap:14px;
  text-align:center; padding:24px; color:#fff;
}
.lp-hero-mark img{ width:132px; height:132px; object-fit:contain; filter:drop-shadow(0 8px 24px rgba(0,0,0,.45)) }
.lp-hero-badge{
  position:absolute; z-index:2; left:-16px; bottom:-28px;
  display:flex; align-items:center; gap:16px;
  border:1px solid rgba(12,19,42,.1); border-radius:16px;
  background:color-mix(in srgb, var(--lp-card) 92%, transparent);
  padding:16px 24px 16px 16px; box-shadow:var(--shadow-lg);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
@media (min-width:640px){ .lp-hero-badge{ left:-40px } }
.lp-hero-badge .glyph{
  display:grid; place-items:center; height:44px; width:44px; flex:none; border-radius:50%;
  background-image:linear-gradient(135deg, var(--grad-1), var(--grad-2) 50%, var(--grad-3));
  color:#0C132A; box-shadow:0 14px 34px -12px rgba(255,179,92,.55);
}
.lp-hero-badge b{ font-size:.875rem; color:var(--lp-ink); display:block }
.lp-hero-badge small{ font-size:.75rem; color:var(--lp-muted) }

/* ── 2. purpose ──────────────────────────────────────────────────────────── */
.lp-purpose-grid{ display:grid; gap:48px }
@media (min-width:1024px){ .lp-purpose-grid{ grid-template-columns:1fr 1.1fr; gap:80px } }
.lp-purpose-say{ display:flex; flex-direction:column; justify-content:flex-end; gap:28px }
.lp-quote{
  border-left:2px solid rgba(255,179,92,.7); padding-left:24px;
  font-size:1.125rem; line-height:1.7; color:rgba(142,179,231,.85);
}
.lp-quote--plain{ border-left-color:transparent; padding-left:24px }
.lp-becoming{ margin-top:96px }
.lp-becoming .a{ font-family:var(--f-display); font-size:clamp(2rem,4.4vw,3rem); line-height:1.1; color:rgba(255,255,255,.6) }
.lp-becoming .b{ font-family:var(--f-display); font-size:clamp(2.4rem,6.4vw,4.5rem); line-height:1.05; color:#fff; margin-top:20px }
.lp-becoming em{ font-style:italic; color:var(--lp-gold) }

/* ── section heads ───────────────────────────────────────────────────────── */
.lp-head{ display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center }
.lp-head p{ max-width:42rem; font-size:1.125rem; line-height:1.7 }

/* ── 3. the weekly rhythm ────────────────────────────────────────────────── */
.lp-two{ display:grid; gap:32px; margin-top:64px }
@media (min-width:1024px){ .lp-two{ grid-template-columns:1fr 1fr } }
.lp-rhythm-card{
  position:relative; display:flex; flex-direction:column; height:100%; min-height:460px;
  overflow:hidden; border:1px solid var(--lp-line); border-radius:32px;
  background:var(--lp-card); padding:36px;
  transition:transform .5s, border-color .5s, box-shadow .5s;
}
@media (min-width:1024px){ .lp-rhythm-card{ padding:44px } }
.lp-rhythm-card:hover{ transform:translateY(-6px); border-color:var(--lp-steel); box-shadow:var(--shadow-lg) }
.lp-rhythm-ghost{
  position:absolute; right:-20px; top:-32px; user-select:none; pointer-events:none;
  font-family:var(--f-display); font-style:italic; font-weight:700; line-height:1;
  font-size:clamp(8rem, 14vw, 12rem); color:transparent;
  -webkit-text-stroke:1.5px rgba(88,112,151,.22);
  transition:-webkit-text-stroke-color .5s;
}
.lp-rhythm-card:hover .lp-rhythm-ghost{ -webkit-text-stroke-color:rgba(255,179,92,.45) }
.lp-rhythm-body{ position:relative; display:flex; flex-direction:column; height:100% }
.lp-rhythm-top{ display:flex; align-items:center; justify-content:space-between; gap:16px }
.lp-rhythm-n{ font-family:var(--f-display); font-size:.875rem; font-weight:600; letter-spacing:.2em; color:var(--lp-steel) }
.lp-live{
  display:inline-flex; align-items:center; gap:8px; border-radius:999px;
  background:var(--lp-navy); color:#fff; padding:8px 16px;
  font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
}
.lp-live i{ height:6px; width:6px; border-radius:50%; background:var(--lp-gold); animation:lp-pulse 2s ease-in-out infinite }
@keyframes lp-pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
@media (prefers-reduced-motion:reduce){ .lp-live i{ animation:none } }
.lp-rhythm-mid{ margin-top:80px; flex:1 }
@media (min-width:1024px){ .lp-rhythm-mid{ margin-top:96px } }
.lp-rhythm-mid h3{ font-size:clamp(1.7rem,2.6vw,2.15rem) }
.lp-rhythm-mid p{ margin-top:16px; max-width:28rem }
.lp-rhythm-foot{
  margin-top:40px; padding-top:24px; border-top:1px solid var(--lp-line);
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:24px;
}
.lp-rhythm-foot .k{ font-size:11px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:var(--lp-steel) }
.lp-rhythm-foot .v{ margin-top:4px; font-size:1rem; font-weight:600; color:var(--lp-ink) }

/* ── 4. replay archive ───────────────────────────────────────────────────── */
.lp-archive-grid{ display:grid; gap:64px; align-items:center }
@media (min-width:1024px){ .lp-archive-grid{ grid-template-columns:1fr 1fr; gap:80px } }
.lp-mock{ position:relative }
.lp-mock::before{
  content:""; position:absolute; inset:-24px; z-index:0; border-radius:40px;
  background:rgba(255,179,92,.1); filter:blur(32px);
}
.lp-mock-shell{
  position:relative; z-index:1; border:1px solid rgba(255,255,255,.1); border-radius:28px;
  background:var(--lp-navy-soft); padding:8px; box-shadow:0 30px 60px -30px rgba(12,19,42,.5);
}
.lp-mock-in{
  border-radius:21px; padding:24px;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
}
@media (min-width:640px){ .lp-mock-in{ padding:28px } }
.lp-mock-head{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:20px }
.lp-mock-head .k{ font-size:11px; font-weight:700; letter-spacing:.28em; text-transform:uppercase; color:var(--lp-gold) }
.lp-mock-head .v{ margin-top:6px; font-family:var(--f-display); font-size:1.25rem; color:#fff }
.lp-mock-tag{
  display:none; border-radius:999px; border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05); padding:6px 12px; font-size:11px; font-weight:600; color:rgba(142,179,231,.8);
}
@media (min-width:640px){ .lp-mock-tag{ display:block } }
.lp-mock-label{ margin-top:24px; font-size:11px; font-weight:700; letter-spacing:.26em; text-transform:uppercase; color:rgba(142,179,231,.75) }
.lp-mock-list{ margin-top:8px; list-style:none; padding:0 }
.lp-mock-list li{ display:flex; align-items:center; gap:16px; padding:14px 0; border-top:1px solid rgba(255,255,255,.06) }
.lp-mock-list li:first-child{ border-top:0 }
.lp-mock-list .play{
  display:grid; place-items:center; height:44px; width:72px; flex:none; border-radius:10px;
  background-image:linear-gradient(135deg, var(--grad-1), var(--grad-2) 50%, var(--grad-3));
  color:#0C132A; box-shadow:0 14px 34px -12px rgba(255,179,92,.55);
}
.lp-mock-list .who{ min-width:0; flex:1 }
.lp-mock-list .who b{ display:block; font-size:.875rem; font-weight:600; color:#fff;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.lp-mock-list .who small{ display:block; margin-top:2px; font-size:.75rem; color:rgba(142,179,231,.75) }
.lp-mock-list .when{ flex:none; text-align:right }
.lp-mock-list .when b{ font-size:.75rem; font-weight:600; color:rgba(255,255,255,.8) }
.lp-mock-list .when span{
  display:inline-block; margin-top:4px; border-radius:999px; border:1px solid rgba(255,179,92,.3);
  background:rgba(255,179,92,.1); padding:1px 8px; font-size:10px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--lp-gold);
}
.lp-mock-foot{
  margin-top:20px; display:flex; align-items:center; justify-content:center; gap:10px;
  border-radius:12px; border:1px solid rgba(255,179,92,.25); background:rgba(255,179,92,.1);
  padding:14px; font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--lp-gold);
}
.lp-mock-empty{ padding:26px 4px; text-align:center; color:rgba(142,179,231,.8); font-size:.87rem; line-height:1.6 }

/* ── 5. membership includes ──────────────────────────────────────────────── */
.lp-perks{ display:flex; flex-wrap:wrap; justify-content:center; gap:24px; margin-top:64px }
.lp-perk{ width:100% }
@media (min-width:640px){ .lp-perk{ width:calc(50% - 12px) } }
@media (min-width:1024px){ .lp-perk{ width:calc(33.333% - 16px) } }
.lp-perk > div{
  height:100%; border:1px solid var(--lp-line); border-radius:16px; background:var(--lp-card);
  padding:32px; transition:transform .3s, border-color .3s, box-shadow .3s;
}
.lp-perk > div:hover{ transform:translateY(-4px); border-color:var(--lp-steel); box-shadow:var(--shadow-md) }
.lp-perk .n{ font-family:var(--f-display); font-size:.875rem; font-weight:600; letter-spacing:.2em; color:var(--brass) }
.lp-perk .rule{ margin-top:20px; height:1px; width:40px; background:var(--lp-line); transition:width .3s, background .3s }
.lp-perk > div:hover .rule{ width:64px; background:var(--lp-gold) }
.lp-perk h3{ margin-top:20px; font-family:var(--f-ui); font-size:13px; font-weight:700;
  letter-spacing:.22em; text-transform:uppercase; color:var(--lp-ink) }
.lp-perk p{ margin-top:12px; line-height:1.7; color:var(--lp-muted) }

/* ── 6. choose your journey ──────────────────────────────────────────────── */
.lp-plans{ display:grid; gap:24px; margin-top:64px }
@media (min-width:768px){ .lp-plans{ grid-template-columns:1fr 1fr } }
@media (min-width:1024px){ .lp-plans{ grid-template-columns:repeat(4,1fr); gap:20px } }
.lp-plan{
  position:relative; display:flex; flex-direction:column; height:100%;
  border:1px solid var(--lp-line); border-radius:28px; background:var(--lp-card); padding:36px;
  transition:transform .5s, border-color .5s, box-shadow .5s;
}
.lp-plan:hover{ transform:translateY(-6px); border-color:var(--lp-steel); box-shadow:var(--shadow-lg) }
.lp-plan .k{ font-size:13px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--lp-steel) }
.lp-plan .amount{ margin-top:28px; display:flex; align-items:baseline; gap:8px }
.lp-plan .amount b{ font-family:var(--f-display); font-size:3rem; font-weight:600; letter-spacing:-.02em; color:var(--lp-ink) }
.lp-plan .amount span{ font-size:.875rem; color:var(--lp-muted) }
.lp-plan .say{ margin-top:16px; flex:1; line-height:1.7; color:var(--lp-muted) }
.lp-plan .lp-btn{ margin-top:32px; width:100% }
.lp-plan--best{
  background:var(--lp-navy); color:#fff; border-color:transparent;
  box-shadow:0 30px 60px -30px rgba(12,19,42,.5); outline:1px solid rgba(255,179,92,.5); outline-offset:-1px;
}
@media (min-width:1024px){ .lp-plan--best{ transform:translateY(-12px) scale(1.05) }
  .lp-plan--best:hover{ transform:translateY(-16px) scale(1.05) } }
.lp-plan--best .k{ color:var(--lp-gold) }
.lp-plan--best .amount b{ color:#fff }
.lp-plan--best .amount span, .lp-plan--best .say{ color:rgba(142,179,231,.8) }
.lp-plan--best .save{ margin-top:16px; font-size:.75rem; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--lp-gold) }
.lp-best-tag{
  position:absolute; top:-14px; left:50%; transform:translateX(-50%); white-space:nowrap;
  border-radius:999px; padding:6px 16px; font-size:11px; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase; color:#0C132A;
  background-image:linear-gradient(135deg, var(--grad-1), var(--grad-2) 50%, var(--grad-3));
  box-shadow:0 14px 34px -12px rgba(255,179,92,.55);
}
.lp-plan--running .lp-btn{ opacity:.6; pointer-events:none }

/* ── 7. FAQ ──────────────────────────────────────────────────────────────── */
.lp-faqs{ margin:56px auto 0; width:100%; max-width:48rem; display:flex; flex-direction:column; gap:16px }
.lp-faq{ border:1px solid var(--lp-line); border-radius:16px; background:var(--lp-card);
  padding-inline:16px; transition:border-color .3s }
.lp-faq:hover{ border-color:var(--lp-steel) }
.lp-faq summary{
  display:flex; cursor:pointer; align-items:center; justify-content:space-between; gap:16px;
  padding:20px 8px; font-size:16px; font-weight:600; color:var(--lp-ink); list-style:none;
}
.lp-faq summary::-webkit-details-marker{ display:none }
.lp-faq[open] summary{ color:var(--brass) }
.lp-faq summary svg{ width:16px; height:16px; flex:none; color:var(--lp-steel); transition:transform .3s }
.lp-faq[open] summary svg{ transform:rotate(180deg) }
.lp-faq p{ padding:0 8px 24px; line-height:1.7; color:var(--lp-muted) }

/* ── 8. the last word ────────────────────────────────────────────────────── */
.lp-final{ text-align:center; padding:112px 0 }
@media (min-width:1024px){ .lp-final{ padding:144px 0 } }
.lp-final .lp-eyebrow i:last-child{ order:3 }
.lp-final h2{ margin-top:24px; font-size:clamp(2.4rem,5.4vw,3.75rem) }
.lp-final .says{ margin:36px auto 0; max-width:42rem; display:flex; flex-direction:column; gap:16px;
  font-size:1.125rem; line-height:1.7; color:rgba(142,179,231,.75) }
.lp-count{ margin:80px auto 0; max-width:56rem }
.lp-count p{ font-family:var(--f-display); font-size:clamp(2rem,5.4vw,3.75rem); line-height:1.15; color:rgba(255,255,255,.75) }
.lp-count p + p{ margin-top:12px }
.lp-count p:last-child{ color:#fff }
.lp-count em{ font-style:italic; color:var(--lp-gold) }

/* ══════════════════════════════════════════════════════════════════════════
   MARKETING CHROME — the header and footer that carry the page
   ══════════════════════════════════════════════════════════════════════════ */
.mk-nav{
  position:sticky; top:0; z-index:50; border-bottom:1px solid transparent;
  transition:background .5s, border-color .5s, backdrop-filter .5s;
}
.mk-nav.is-stuck{
  background:color-mix(in srgb, var(--paper) 85%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom-color:color-mix(in srgb, var(--ink) 10%, transparent);
}
.mk-nav .inner{
  width:100%; max-width:1152px; margin-inline:auto; padding-inline:24px;
  height:76px; display:flex; align-items:center; justify-content:space-between; gap:24px;
}
@media (min-width:768px){ .mk-nav .inner{ padding-inline:40px } }

.mk-brand{ display:flex; align-items:center; gap:10px; text-decoration:none }
.mk-logo{ width:44px; height:44px; border-radius:50%; flex:none; display:block }
.mk-brand b{
  font-family:var(--f-display); font-size:1.25rem; font-weight:700;
  letter-spacing:-.02em; color:var(--ink); line-height:1;
}
@media (max-width:520px){
  .mk-logo{ width:38px; height:38px }
  .mk-nav .inner{ gap:12px }
}
.mk-brand:hover span{ color:var(--brass) }

/* One link, kept to the right with the sign-in and the call to action, so the
   bar reads brand-left / actions-right instead of trailing off in the middle. */
.mk-links{ display:none; align-items:center; gap:32px; margin-left:auto }
@media (min-width:1024px){ .mk-links{ display:flex } }
.mk-links a, .mk-links button{
  border:0; background:none; padding:0; cursor:pointer; font-family:var(--f-ui);
  font-size:.875rem; font-weight:500; text-decoration:none;
  color:color-mix(in srgb, var(--ink) 70%, transparent); transition:color .3s;
}
.mk-links a:hover, .mk-links button:hover{ color:var(--ink) }

.mk-nav .mk-cta{ display:none }
@media (min-width:640px){ .mk-nav .mk-cta{ display:inline-flex } }
.mk-nav .mk-cta-sm{ display:inline-flex; height:40px; width:40px; padding:0; border-radius:50% }
@media (min-width:640px){ .mk-nav .mk-cta-sm{ display:none } }

.mk-foot{
  border-top:1px solid color-mix(in srgb, var(--ink) 10%, transparent);
  background:var(--paper); padding:64px 0;
}
@media (min-width:1024px){ .mk-foot{ padding:80px 0 } }
.mk-foot .inner{
  width:100%; max-width:1152px; margin-inline:auto; padding-inline:24px;
  display:flex; flex-direction:column; align-items:center; gap:40px; text-align:center;
}
.mk-foot .eyebrow{ color:var(--steel) }
.mk-foot .motto{ margin-top:16px; font-family:var(--f-display); font-style:italic;
  font-size:1.125rem; color:color-mix(in srgb, var(--ink) 70%, transparent) }
.mk-foot nav{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  column-gap:32px; row-gap:12px; font-size:.875rem; font-weight:500 }
.mk-foot nav a, .mk-foot nav button{
  border:0; background:none; padding:0; cursor:pointer; font-family:var(--f-ui);
  font-size:.875rem; font-weight:500; text-decoration:none;
  color:color-mix(in srgb, var(--ink) 70%, transparent); transition:color .3s;
}
.mk-foot nav a:hover, .mk-foot nav button:hover{ color:var(--brass) }
.mk-foot .legal{ display:flex; align-items:center; gap:20px; font-size:.875rem; color:var(--ink-mute) }
.mk-foot .legal a{ color:var(--ink-mute); text-decoration:none; transition:color .3s }
.mk-foot .legal a:hover{ color:var(--ink) }
.mk-foot .legal i{ height:12px; width:1px; background:var(--line-strong) }
.mk-foot .copy{ font-size:.75rem; color:var(--ink-mute) }
</style>

const YT = {
  parse(url){
    if(!url) return "";
    const s = String(url).trim();
    if(/^[\w-]{11}$/.test(s)) return s;
    const m = s.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
    return m ? m[1] : "";
  },
  embed(id, auto){ return "https://www.youtube-nocookie.com/embed/" + id + "?rel=0&modestbranding=1" + (auto ? "&autoplay=1" : ""); },
  watch(id){ return "https://www.youtube.com/watch?v=" + id; }
};

const State = {

  owned: [],
  /* The disciples register. `discipleMe` is this browser's own registration —

function load(){
  const saved = safe.read();
  State.trainings = (saved && saved.trainings) ? saved.trainings : structuredClone(SEED.trainings);
  State.members  = (saved && saved.members)  ? saved.members  : structuredClone(SEED.members);
  State.payments = (saved && saved.payments) ? saved.payments : structuredClone(SEED.payments);
  State.progress = (saved && saved.progress) || {};
  State.notes    = (saved && saved.notes) || {};
  State.session  = (saved && saved.session) || State.session;
}
function persist(){
  safe.write({ trainings:State.trainings, members:State.members, payments:State.payments,
    progress:State.progress, notes:State.notes, session:State.session });
}
function resetAll(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  State.trainings = structuredClone(SEED.trainings);
  State.members = structuredClone(SEED.members);
  State.payments = structuredClone(SEED.payments);
  State.progress = {}; State.notes = {};
  State.session = { role:"guest", name:"", email:"", plan:"", until:"" };
  go("/"); toast("Demo data restored");
}

/* ── helpers ────────────────────────────────────────────── */

const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso = n => "₱" + Number(n).toLocaleString("en-PH");
const initials = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const uid = p => p + "_" + Math.random().toString(36).slice(2,8);

/* Access has two doors now, and a topic only needs one of them:
     - a pass, which opens everything until its date
     - an Individual Teaching purchase, which opens exactly one topic, for good
   There is still no free tier and no free lesson.

   Plan names and prices are DATA, not constants: an administrator changes them
   in the admin and the server sends the new set down with the content tree. The
   two lookups below are the only place the app asks what a plan is called, so
   nothing has a price or a name baked into it. */
function planById(id){ return (State.plans || []).find(p => p.id === id) || null; }
function planName(id){
  if(id === "admin") return "Full access";
  if(!id || id === "none") return "No pass";
  const p = planById(id);
  return p ? p.name : String(id);
}
function planSpanOf(id){
  const p = planById(id);
  if(p && p.span) return p.span;
  return { once:"one teaching, kept", week:"7 days", month:"1 month", year:"1 year" }[p ? p.billing : id] || "";
}
/* A plan carries its own bullet list when the seed wrote one. A plan the
   ministry created in the admin has only a description, so the list is derived
   from what the plan actually grants rather than invented. */
function planPerks(p){
  if(!p) return [];
  if(p.perks && p.perks.length) return p.perks;
  if(p.scope === "topic" || p.billing === "once"){
    return ["The one topic you choose, permanently", "Yours whether or not you hold a pass",
            "Watch on any device"];
  }
  return ["Every training, every series, for " + planSpanOf(p.id),
          "Study notes as PDF", "Watch on any device"];
}
function singleTopicPlan(){
  return (State.plans || []).find(p => p.scope === "topic" || p.billing === "once") || null;
}
/* The cheapest thing on sale, for "from ₱x" lines. */
function cheapestPlan(){
  return (State.plans || []).slice().sort((a,b) => a.price - b.price)[0] || null;
}

function isAdmin(){ return State.session.role === "admin"; }
function canWatch(){ return isAdmin() || subActive(); }

/* Whether ONE topic opens. The server decides this per topic and stamps the
   answer on the row (`locked`, `owned`); this only reads it. In demo mode there
   are no stamps and it falls back to the pass, which is the old behaviour. */
function topicOpen(v){
  if(isAdmin()) return true;
  if(v && v.owned) return true;
  if(v && v.locked === false) return true;
  if(v && v.locked === true) return false;
  return subActive();
}
/* Bought outright, as opposed to open because a pass is running. */
function topicOwned(v){ return !!(v && v.owned); }
/* ── access window ──────────────────────────────────────── */
const DAY = 24*3600*1000;
function today(){ return new Date(); }
/* Local calendar date, not UTC — in Manila (UTC+8) toISOString() before 08:00
   would stamp yesterday. */
function isoDate(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
/* Add one pass length, clamped to the end of the target month — plain
   setMonth() turns 31 Jan into 3 Mar and hands out three free days. */
function addPeriod(from, period){
  if(period === "week") return new Date(from.getFullYear(), from.getMonth(), from.getDate()+7, 12, 0, 0);
  const day = from.getDate();
  const y = from.getFullYear() + (period === "year" ? 1 : 0);
  const m = from.getMonth() + (period === "year" ? 0 : 1);
  const lastDay = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(day, lastDay), 12, 0, 0);
}
function prettyDate(iso){
  if(!iso) return "—";
  const d = new Date(iso + (iso.length === 10 ? "T00:00:00" : ""));
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-PH", { day:"numeric", month:"short", year:"numeric" });
}
function daysLeft(iso){
  if(!iso) return 0;
  return Math.ceil((Date.parse(iso + "T23:59:59") - Date.now()) / DAY);
}
/* One question decides everything: is a pass still running today? */
function subActive(){
  const s = State.session;
  return !!s.until && daysLeft(s.until) > 0;
}
/* The pass being held right now — lapses to the free preview when the window
   closes. Convenience only: the server must check this too. */
function myPass(){
  if(isAdmin()) return "admin";
  const s = State.session;
  return (s.plan && subActive()) ? s.plan : "none";
}

/* ── content: Training -> Series -> Topic ────────────────
   Admins see drafts; everyone else sees only what is published. */
function allTrainings(){ return State.trainings || []; }
function pubTrainings(){ return allTrainings().filter(t => t.published || isAdmin()); }
function pubSeries(t){ return (t && t.series ? t.series : []).filter(s => s.published || isAdmin()); }
function pubTopics(s){ return (s && s.topics ? s.topics : []).filter(v => v.published || isAdmin()); }

function findTraining(tid){ return allTrainings().find(t => t.id === tid) || null; }
function findSeries(tid, sid){
  const t = findTraining(tid);
  return t ? (t.series || []).find(s => s.id === sid) || null : null;
}
function findTopic(tid, sid, vid){
  const s = findSeries(tid, sid);
  return s ? (s.topics || []).find(v => v.id === vid) || null : null;
}

/* Every topic bought outright, resolved back to the tree so it can be listed
   and linked. Reads State.owned, which the server sends with the content. */
function ownedTopicList(){
  const out = [];
  (State.owned || []).forEach(function(key){
    const bits = String(key).split("/");
    if(bits.length !== 3) return;
    const t = findTraining(bits[0]), sx = findSeries(bits[0], bits[1]), v = findTopic(bits[0], bits[1], bits[2]);
    if(t && sx && v) out.push({ t:t, s:sx, v:v });
  });
  return out;
}
/* "t1/se1/v3" -> "Discipleship Series 1 — Repentance That Sticks", for a
   payment row. Falls back to the raw key rather than to nothing, so a topic
   deleted after it was sold still shows what was bought. */
function topicLabel(key){
  const bits = String(key || "").split("/");
  if(bits.length !== 3) return String(key || "");
  const sx = findSeries(bits[0], bits[1]), v = findTopic(bits[0], bits[1], bits[2]);
  if(!v) return String(key);
  return (sx ? sx.title + " — " : "") + v.title;
}

/* One key per topic, so progress survives a rename. */
function pKey(tid, sid, vid){ return tid + "/" + sid + "/" + vid; }
function isDone(tid, sid, vid){ return !!State.progress[pKey(tid, sid, vid)]; }

function seriesDone(t, s){ return pubTopics(s).filter(v => isDone(t.id, s.id, v.id)).length; }
function seriesPct(t, s){
  const n = pubTopics(s).length;
  return n ? Math.round(seriesDone(t, s) / n * 100) : 0;
}
function trainingTopics(t){ return pubSeries(t).reduce((a, s) => a + pubTopics(s).length, 0); }
function trainingDone(t){ return pubSeries(t).reduce((a, s) => a + seriesDone(t, s), 0); }
function trainingPct(t){
  const n = trainingTopics(t);
  return n ? Math.round(trainingDone(t) / n * 100) : 0;
}
function seriesMins(s){
  let sec = 0;
  pubTopics(s).forEach(v => {
    const p = String(v.dur || "0:00").split(":");
    sec += (+p[0] || 0) * 60 + (+p[1] || 0);
  });
  return Math.round(sec / 60);
}
function trainingMins(t){ return pubSeries(t).reduce((a, s) => a + seriesMins(s), 0); }
function totalTopics(){
  return allTrainings().reduce((a, t) =>
    a + (t.series || []).reduce((b, s) => b + (s.topics || []).filter(v => v.published).length, 0), 0);
}
function totalSeries(){
  return allTrainings().reduce((a, t) => a + (t.series || []).filter(s => s.published).length, 0);
}
/* The next unwatched topic anywhere, for "continue where you stopped". */
function nextUp(){
  for(const t of pubTrainings()){
    for(const s of pubSeries(t)){
      for(const v of pubTopics(s)){
        if(!isDone(t.id, s.id, v.id)) return { t:t, s:s, v:v };
      }
    }
  }
  const t = pubTrainings()[0];
  const s = t ? pubSeries(t)[0] : null;
  const v = s ? pubTopics(s)[0] : null;
  return (t && s && v) ? { t:t, s:s, v:v } : null;
}

/* toast */
function toast(msg){
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),320); }, 2200);
