/* ── addresses ────────────────────────────────────────────────────────────
   Every screen has a real address: /pricing, /app/library, /admin/disciples.
   The `.htaccess` hands any path that is not a file to index.html, and the
   router below reads the path instead of a hash.

   Two things have to keep working while that is true.

   A page opened from the filesystem — the prototype, an emailed copy of
   index.html — has no server to do the rewrite, so it falls back to hashes.
   That is what CLEAN_URLS decides, once, at load.

   And every #/ link already in the wild has to keep working: bookmarks, links
   in old emails, whatever TGFM has already sent out. adoptLegacyHash() turns
   one into its clean equivalent on arrival, so nothing that used to work
   stops working. */
const CLEAN_URLS = (location.protocol === "http:" || location.protocol === "https:")
                && !/\.html?$/i.test(location.pathname);

/* Where the app is mounted. Derived from the one thing the ministry already
   configures: "/api" means the site is at the root, "/disciple/api" means it
   lives in a folder and every address carries that prefix. */
function appBase(){
  return String(API.base || "").replace(/\/+$/, "").replace(/\/api$/, "");
}

/* "#/pricing", "/pricing" and "pricing" all mean the same route. */
function toPath(x){
  let p = String(x == null ? "/" : x).replace(/^#/, "");
  if(p.charAt(0) !== "/") p = "/" + p;
  return p;
}
/* The address to put in an href. */
function url(x){
  const p = toPath(x);
  return CLEAN_URLS ? (appBase() + p) : ("#" + p);
}
/* An uploaded file's address.
   ────────────────────────────────────────────────────────────────────────
   The database stores "uploads/abc.jpg" — a RELATIVE url. That was harmless
   while every page lived at "/", because the browser resolved it against the
   root. With real addresses it is a bug: on /admin/training/t1 the browser
   goes looking for /admin/training/uploads/abc.jpg and the image breaks.

   So every stored path is made absolute here, at the one place images are
   rendered from. Anything already absolute — a full URL, or a path from the
   root — is handed back untouched. */
function assetUrl(stored){
  const v = String(stored || "").trim();
  if(!v) return "";
  if(/^(https?:)?\/\//i.test(v) || v.charAt(0) === "/" || v.indexOf("data:") === 0) return v;
  return appBase() + "/" + v.replace(/^\/+/, "");
}

/* The route segments, from whichever half of the URL is carrying them. */
function routeOf(){
  if(!CLEAN_URLS){
    return (location.hash || "#/").replace(/^#/, "").split("/").filter(Boolean);
  }
  let p = location.pathname;
  const b = appBase();
  if(b && p.indexOf(b) === 0) p = p.slice(b.length);
  return p.split("/").filter(Boolean);
}

/* navigation — the one door every screen change goes through */
function go(x){
  const p = toPath(x);
  if(!CLEAN_URLS){
    if(location.hash === "#" + p) render(); else location.hash = "#" + p;
    return;
  }
  const href = appBase() + p;
  if(location.pathname === href){ render(); return; }
  history.pushState(null, "", href);
  navigated();
}

/* generated artwork — no network images */
/* Track covers are generated, never fetched. They stay inside the brand: a
   midnight-navy ground, one restrained hue shift per track so the six tracks
   are told apart at a glance, and a thread of the logo's gold. */
function isDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t === "dark") return true;
  if(t === "light") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function paintThumb(cv, hue, seed){
  const w = cv.width = cv.clientWidth * 2 || 640, h = cv.height = cv.clientHeight * 2 || 360;
  const g = cv.getContext("2d");
  const base = 200 + ((hue % 360) / 360) * 50;   // 200-250: blue through indigo, never green
  const dark = isDark();
  const grd = g.createLinearGradient(0,0,w,h);
  /* Light theme lifts the whole ramp so a cover never reads as a hole in the page. */
  grd.addColorStop(0, "hsl(" + base + (dark ? " 42% 22%" : " 38% 42%") + ")");
  grd.addColorStop(1, "hsl(" + (base - 14) + (dark ? " 55% 9%" : " 48% 24%") + ")");
  g.fillStyle = grd; g.fillRect(0,0,w,h);
  let s = (seed*9301 + 49297) % 233280;
  const rnd = ()=> (s = (s*9301 + 49297) % 233280) / 233280;
  g.globalAlpha = .16; g.strokeStyle = "#8EB3E7"; g.lineWidth = Math.max(1.2, w/560);
  for(let i=0;i<9;i++){
    g.beginPath();
    const y = h*rnd();
    g.moveTo(-10, y);
    g.bezierCurveTo(w*.3, y - h*rnd()*.5, w*.7, y + h*rnd()*.5, w+10, h*rnd());
    g.stroke();
  }
  g.globalAlpha = .10;
  for(let i=0;i<3;i++){
    g.beginPath(); g.arc(w*rnd(), h*rnd(), h*(.18+rnd()*.3), 0, Math.PI*2);
    g.fillStyle = "#8EB3E7"; g.fill();
  }
  /* one ember of the logo's gold, so every cover belongs to the same set */
  g.globalAlpha = .5; g.strokeStyle = "#FFB35C"; g.lineWidth = Math.max(1.4, w/420);
  g.beginPath();
  const gy = h * (.25 + rnd() * .5);
  g.moveTo(-10, gy);
  g.bezierCurveTo(w*.35, gy - h*.28, w*.65, gy + h*.3, w+10, gy - h*.1);
  g.stroke();
  g.globalAlpha = 1;
  const vg = g.createLinearGradient(0,h*.3,0,h);
  vg.addColorStop(0,"rgba(11,18,38,0)"); vg.addColorStop(1, dark ? "rgba(11,18,38,.72)" : "rgba(11,18,38,.42)");
  g.fillStyle = vg; g.fillRect(0,h*.3,w,h*.7);
}
function mountCanvases(root){
  $$("canvas[data-hue]", root).forEach(cv=>{
    requestAnimationFrame(()=> paintThumb(cv, +cv.dataset.hue, +cv.dataset.seed || 7));
  });
}
/* ══════════════════════════════════════════════════════════════
   Content storage

   This is the layer that decides whether an edit is seen by everyone
   or only by the person who made it.

     API.enabled === false   ->  State.trainings lives in localStorage.
                                 Per-browser. Demo only.
     API.enabled === true    ->  every read comes from api/content.php and
                                 every write goes to api/admin_content.php,
                                 which writes to MySQL. Everyone sees it.

   Every mutation below funnels through saveContent(), so there is exactly
   one place that knows the difference.
   ══════════════════════════════════════════════════════════════ */

async function apiGet(path){
  const res = await fetch(API.base + path, { credentials:"same-origin" });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(API.base + path, {
    method:"POST", credentials:"same-origin",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

/* Which of the two the screen is currently showing. Read by storageNotice(),
   so an admin can never be in doubt. */
var CONTENT_SOURCE = "seed";   // "seed" | "server" | "unreachable"

/* Pull the whole tree. The server returns drafts only to an admin. */
async function loadContent(){
  if(!API.enabled) return false;
  try{
    const data = await apiGet("/content.php");
    if(data && Array.isArray(data.trainings)){
      State.trainings = data.trainings;
      /* Plans travel with the tree. Prices an administrator changed a minute
         ago are on the pricing page a minute later, with nothing rebuilt — and
         the browser still never sends an amount to the checkout. */
      if(Array.isArray(data.plans) && data.plans.length) State.plans = data.plans;
      State.owned = Array.isArray(data.owned) ? data.owned : [];
      CONTENT_SOURCE = "server";
      return true;
    }
    throw new Error("content.php did not return a trainings list");
  }catch(err){
    /* Do not leave the site blank and do not pretend. Put the demo content back
       so the page still works, and say plainly that this is not the real thing.
       A silent empty page is how the last failure went unnoticed. */
    console.error("content load failed", err);
    CONTENT_SOURCE = "unreachable";
    if(!State.trainings || !State.trainings.length){
      State.trainings = JSON.parse(JSON.stringify(SEED.trainings));
    }
    toast("Could not reach api/content.php — showing demo content");
  }
  return false;
}

/* One admin write. Sends the action, then re-reads so the screen shows what
   the database actually holds rather than what we hoped it would hold. */
async function saveContent(action, payload, okMessage){
  if(!API.enabled){
    persist();
    if(okMessage) toast(okMessage);
    render();
    return true;
  }
  try{
    await apiPost("/admin_content.php", Object.assign({ action:action }, payload || {}));
    await loadContent();
    if(okMessage) toast(okMessage);
    render();
    return true;
  }catch(err){
    toast(err.message || "Could not save");
    return false;
  }
}

/* ── one payment, for the receipt and create-account screens ──────────────
   These two screens are reached with no account and, after a real gateway
   redirect, in a browser that has never seen this reference: the server mints
   its own, and it is the server's that comes back in the URL. So the record has
   to be fetched, not looked up locally. Without this the buyer's money is gone
   and the screen says "not on file".

   api/receipt.php answers only to the browser that started the payment (its own
   PHP session), to the member it belongs to, or to an admin. */
var PAYMENT_CHECKED = "";      // the last reference the server has answered on

async function loadPayment(ref){
  if(!API.enabled || !ref) return null;
  try{
    const data = await apiGet("/receipt.php?ref=" + encodeURIComponent(ref));
    const p = data && data.payment;
    if(!p) return null;
    const i = State.payments.findIndex(x => x.ref === p.ref);
    if(i >= 0) State.payments[i] = Object.assign({}, State.payments[i], p);
    else State.payments.unshift(p);
    persist();
    return p;
  }catch(err){
    console.error("receipt load failed", err);
    return null;
  }finally{
    /* Answered, one way or the other — so the screen may now say "not on file"
       instead of "checking". Before this point it must not. */
    PAYMENT_CHECKED = ref;
  }
}

/* ── the admin's people and money ─────────────────────────────────────────
   These were the last two screens still reading the seeded demo data: a real
   sign-up never appeared in Disciples, and a real payment never appeared in

/* ── featured images ──────────────────────────────────────────────────────
   The file goes up as multipart, not JSON: a base64 data URL would inflate it
   by a third and shared hosting has a modest POST limit. The server re-encodes
   whatever arrives, so what comes back is a path, never the original bytes. */
async function uploadImage(fields, file){
  if(!API.enabled){ toast("Featured images need the server switched on"); return null; }
  const fd = new FormData();
  Object.keys(fields).forEach(k => fd.append(k, fields[k]));
  fd.append("image", file);
  try{
    const res = await fetch(API.base + "/admin_image.php", {
      method:"POST", credentials:"same-origin", body: fd
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
    await loadContent();
    toast("Image saved");
    render();
    return data;
  }catch(err){
    toast(err.message || "Could not upload that image");
    return null;
  }
}

async function removeImage(fields){
  if(!API.enabled){ toast("Featured images need the server switched on"); return false; }
  try{
    await apiPost("/admin_image.php", Object.assign({ action:"remove" }, fields));
    await loadContent();
    toast("Image removed");
    render();
    return true;
  }catch(err){ toast(err.message || "Could not remove that image"); return false; }
}

/* ── deleting a payment record ────────────────────────────────────────────
   The server refuses a checkout that may still be at the gateway; `force` is
   only ever sent after the admin has been told why and asked again. */
async function deletePayment(ref, force){
  if(!API.enabled){
    State.payments = State.payments.filter(p => p.ref !== ref);
    persist(); toast("Payment record deleted"); render(); return true;
  }
  try{
    const data = await apiPost("/payments.php", { action:"delete", ref:ref, force: !!force });
    await loadPayments();
    toast(data.note || "Payment record deleted");
    render();
    return true;
  }catch(err){
    toast(err.message || "Could not delete that record");
    return false;
  }
}

   Free, and the gate on every subscription. loadSignup() answers two questions
   at once: what the form should offer, and whether THIS browser (or the
   signed-in member) is already on the register. It never answers "is this
   email registered?" for an address somebody typed — that would turn the
   register into a way to test who is a member. */
async function loadSignup(){

/* Routes that cannot paint until the server has answered. */
async function preloadForRoute(){
  const p = routeOf();
  if(p[0] === "receipt" || p[0] === "create-account") return loadPayment(p[1]);

  /* The admin overview counts disciples and money, so it needs both. */
  if(p[0] === "disciple-signup") return loadSignup();

  if(p[0] === "admin"){
    if(p[1] === "plans") return loadPlans();
    if(p[1] === "disciples") return loadDisciples();
    await Promise.all([loadMembers(), loadPayments()]);
    return;
  }

  /* The pricing and checkout pages need to know whether this person is on the
     register before they paint, or the gate flashes on after the fact. */
  if(p[0] === "pricing" || p[0] === "checkout"){
    if(!State.pastors) await loadSignup();
    return;
  }
  if(p[0] === "app" && p[1] === "account") await loadPayments();
}

/* Whether the signed-in session is still valid, straight from the server. */
async function loadMe(){
  if(!API.enabled) return;
  try{
    const data = await apiGet("/auth.php?do=me");
    if(data && data.user){
      State.session = {
        role: data.user.role === "admin" ? "admin" : "disciple",
        name: data.user.name, email: data.user.email,
        plan: data.user.plan, until: data.user.accessUntil || ""
      };
    }else{
      State.session = { role:"guest", name:"", email:"", plan:"", until:"" };
    }
  }catch(err){ /* offline: keep whatever we had */ }
}

/* Boot order matters: session first (it decides whether drafts come back),
   then content, then paint. */
async function boot(){
  loadTheme();
  /* An old "#/pricing" link becomes "/pricing" before anything reads a route. */
  adoptLegacyHash();
  load();
  if(API.enabled){
    State.trainings = [];
    render();                 // paint the shell straight away
    await loadMe();
    await loadContent();
    await loadSignup();       // are they on the register, and what does the form offer
    await preloadForRoute();  // a receipt link opened cold still shows its receipt
  }
  render();
}

function thumbHTML(item, opts){
  opts = opts || {};
  const words = String(item.title || "").split(/\s+/).filter(w => w.length > 2 && /[A-Za-z]/.test(w[0]));
  const mark = opts.mark != null ? opts.mark : words.slice(0,2).map(w=>w[0].toUpperCase()).join("");
  const hue = opts.hue != null ? opts.hue : (item.hue != null ? item.hue : 220);
  /* A featured image the ministry uploaded wins over the generated art. The
     art is not a placeholder to be ashamed of — it is what everything without
     a photograph still looks like, and the two have to sit side by side in the
     same grid without one looking broken. */
  const img = item && item.image ? String(item.image) : "";
  return '<div class="thumb">' +
      (img
        ? '<img src="' + esc(assetUrl(img)) + '" alt="" loading="lazy" decoding="async" ' +
          'style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">'
        : '<canvas data-hue="' + hue + '" data-seed="' + (opts.seed || hue) + '"></canvas>') +
      (img ? '' : '<span class="thumb-mark">' + esc(mark) + '</span>') +
      (opts.dur ? '<span class="dur">' + esc(opts.dur) + '</span>' : '') +
      (opts.locked ? '<span class="lockbox">' + icon("lock") + '</span>'
                   : (opts.play ? '<span class="playglyph">' + icon("play") + '</span>' : '')) +
    '</div>';
}

function planCardHTML(p, opts){
  opts = opts || {};
  const single = p.scope === "topic" || p.billing === "once";

    ? "Pick the teaching on the next screen"

    '<h3>' + esc(p.name) + '</h3>' +
    (p.blurb ? '<p class="muted" style="font-size:.87rem; line-height:1.5">' + esc(p.blurb) + '</p>' : '') +

    (note ? '<div class="muted" style="font-size:12px; margin-top:-8px">' + esc(note) + '</div>' : '') +

   THE HOME PAGE

   Built to the design TGFM supplied, with one rule applied throughout: the
   words are theirs, the numbers are the database's. Prices come from
   State.plans, so a price the pastor changes in the admin is on this page a
   moment later; the replay list is the teachings actually published, not three
   invented rows; the annual saving is worked out rather than asserted.

/* Find a training by the name the home page uses for it, so the cards keep
   working after the ministry renames something. */
function trainingLike(needle, nth){
  const all = pubTrainings();
  const hit = all.find(t => String(t.title).toLowerCase().includes(needle));
  return hit || all[nth] || null;
}

/* The hero picture. TGFM can drop their own photograph in by giving the first
   training a featured image in the admin — until they do, the brand mark on
   the house navy stands in, which is a deliberate cover rather than a hole. */
function heroArt(){
  const t = pubTrainings().find(x => x.image);
  if(t){
    return '<img src="' + esc(assetUrl(t.image)) + '" alt="' + esc(t.title) + '" decoding="async">';
  }
  return '<canvas data-hue="214" data-seed="41"></canvas>' +
    '<div class="lp-hero-mark">' +
      '<img src="' + LOGO_SM + '" alt="" width="104" height="104">' +
      '<span class="eyebrow" style="color:rgba(255,255,255,.72)">' + esc(SEED.org.full) + '</span>' +
    '</div>';
}

/* The three most recent published teachings, newest first. Where the reference
   design had "Week 32" typed in, this reads the tree — an empty library says
   so rather than pretending to have a back catalogue. */
function recentTeachings(n){
  const out = [];
  pubTrainings().forEach(function(t){
    pubSeries(t).forEach(function(s){
      pubTopics(s).forEach(function(v){ out.push({ t:t, s:s, v:v }); });
    });
  });
  return out.slice(-n).reverse();
}

/* ── search ─────────────────────────────────────────────── */
function searchResults(q){
  const needle = q.toLowerCase();
  const hits = [];
  pubTrainings().forEach(function(t){
    if(t.title.toLowerCase().includes(needle) || (t.blurb||"").toLowerCase().includes(needle)) hits.push({t:t});
    pubSeries(t).forEach(function(s){
      if(s.title.toLowerCase().includes(needle) || (s.blurb||"").toLowerCase().includes(needle)) hits.push({t:t, s:s});
      pubTopics(s).forEach(function(v){
        if(v.title.toLowerCase().includes(needle)) hits.push({t:t, s:s, v:v});
      });
    });
  });
  if(!hits.length) return '<div class="empty">' + icon("search") + '<p>Nothing matches “' + esc(q) + '”.</p></div>';
  return '<div class="panel"><div class="panel-head"><h2>' + hits.length + ' result' + (hits.length>1?"s":"") + ' for “' + esc(q) + '”</h2></div>' +
    '<div class="lessons">' + hits.map(function(h){
      const href = h.v ? "#/app/watch/" + h.t.id + "/" + h.s.id + "/" + h.v.id
                 : h.s ? "#/app/series/" + h.t.id + "/" + h.s.id
                       : "#/app/training/" + h.t.id;
      const title = h.v ? h.v.title : h.s ? h.s.title : h.t.title;
      const sub   = h.v ? h.t.title + " · " + h.s.title : h.s ? h.t.title : "Training";
      return '<a class="lesson" href="' + href + '"><span class="idx">' +
        (h.v ? icon("play") : h.s ? icon("book") : icon("chart")) + '</span>' +
        '<span class="t"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></span>' +
        '<span class="meta">' + (h.v ? '<span class="num">' + esc(h.v.dur) + '</span>' : '') + '</span></a>';
    }).join("") + '</div></div>';
}

function viewSeries(tid, sid){
  const t = findTraining(tid), s = findSeries(tid, sid);
  if(!t || !s) return appShell('<div class="empty">' + icon("book") + '<p>That series no longer exists.</p>' +
    '<a class="btn btn--ghost" href="#/app/library">Back to trainings</a></div>', "d-library");
  const list = pubTopics(s);
  const pct = seriesPct(t, s);
  /* The series as a whole is "locked" only when nothing in it opens. One
     Individual Teaching purchase inside it is enough to change that. */
  const anyOpen = list.some(topicOpen);
  const locked = !anyOpen;
  const first = list.find(v => topicOpen(v) && !isDone(t.id, s.id, v.id))
             || list.find(topicOpen) || list[0];

  const head =
    '<div class="panel" style="margin-bottom:22px"><div class="panel-body" style="display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:24px; align-items:center">' +

        '<div class="row gap-6 wrap"><span class="pill pill--sage">' + esc(t.title) + '</span>' +
          (locked ? '<span class="pill pill--warn">' + icon("lock") + 'Needs a subscription</span>'

  const topics = list.length

    '<a class="btn btn--ghost" href="#/app/library">Back to trainings</a></div>', "d-library");

  const list = pubTopics(s);
  const i = list.indexOf(v);
  const key = pKey(t.id, s.id, v.id);
  const done = !!State.progress[key];
  const can = topicOpen(v);
  const one = singleTopicPlan();

  const stage = can
    ? '<div class="player">' +
        (playing
          ? '<iframe src="' + YT.embed(v.yt, true) + '" title="' + esc(v.title) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>'
          : '<button class="poster" data-act="play" aria-label="Play ' + esc(v.title) + '">' +
            thumbHTML(s, { hue:t.hue, play:true, dur:v.dur, mark:String(i+1).padStart(2,"0"), seed:t.hue + i*17 }) + '</button>') +
      '</div>' +
      '<div class="player-note">' + icon("video") + '<span>Streamed from the TGFM YouTube channel.</span>' +
        '<a href="' + YT.watch(v.yt) + '" target="_blank" rel="noopener">Trouble playing? Open on YouTube ↗</a></div>'
    : '<div class="paywall"><div class="inner">' + icon("lock") +
        '<h3>This teaching is not open yet</h3>' +
        '<p class="muted" style="font-size:.9rem">' +
          (one
            ? 'Buy this one teaching for ' + peso(one.price) + ' and it is yours to keep — or take a pass and all ' +
              list.length + ' topics of ' + esc(s.title) + ', and every other training, open at once.'
            : 'A subscription opens all ' + list.length + ' topics of ' + esc(s.title) + ' — and every other training.') +
        '</p>' +
        '<div class="row gap-8 wrap" style="justify-content:center">' +
          (one
            ? '<a class="btn btn--primary" href="#/checkout/' + one.id + '/' + t.id + '/' + s.id + '/' + v.id + '">' +
              icon("wallet") + 'Buy this teaching · ' + peso(one.price) + '</a>' +
              '<a class="btn btn--ghost" href="#/app/account">Or take a pass</a>'
            : '<a class="btn btn--primary" href="#/app/account">See subscriptions</a>') +
          '<a class="btn btn--quiet" href="#/app/series/' + t.id + '/' + s.id + '">Back to the outline</a></div>' +
      '</div></div>';

  const main =
    stage +
    '<div class="row spread wrap gap-16" style="margin-top:20px; align-items:flex-start">' +
      '<div class="stack gap-6 grow" style="min-width:240px">' +
        '<span class="eyebrow">' + esc(t.title) + ' · ' + esc(s.title) + ' · Topic ' + (i+1) + ' of ' + list.length + '</span>' +
        '<h2 class="display" style="font-size:1.75rem">' + esc(v.title) + '</h2>' +
        '<p class="muted" style="font-size:.9rem; max-width:62ch">' + esc(v.note || "") + '</p>' +
        '<p class="muted" style="font-size:.85rem">' + esc(s.teacher) + ' · ' + esc(v.dur) +
          (topicOwned(v) ? ' · <span class="pill pill--good">Bought — yours to keep</span>' : '') + '</p>' +
      '</div>' +
      (can ? '<button class="btn ' + (done ? "" : "btn--primary") + '" data-act="toggle-done" data-key="' + key + '">' +
        icon(done ? "check" : "circle") + (done ? "Completed" : "Mark complete") + '</button>' : '') +
    '</div>' +
    (can ? '<div class="panel" style="margin-top:22px"><div class="panel-head"><h2>My notes</h2>' +
      '<span class="muted" style="margin-left:auto; font-size:12px">Saved on this device</span></div>' +
      '<div class="panel-body notes-area">' +
        '<textarea class="textarea" data-act="note" data-key="' + key + '" placeholder="What is God saying to you in this topic?">' + esc(State.notes[key]||"") + '</textarea>' +
      '</div></div>' : '') +
    '<div class="row gap-8 wrap" style="margin-top:20px">' +
      (i > 0 ? '<a class="btn btn--ghost" href="#/app/watch/' + t.id + '/' + s.id + '/' + list[i-1].id + '">' + icon("back") + 'Previous</a>' : '') +
      (i < list.length-1 ? '<a class="btn btn--ghost" href="#/app/watch/' + t.id + '/' + s.id + '/' + list[i+1].id + '">Next topic' + icon("arrow") + '</a>' : '') +
    '</div>';

  const side =
    '<div class="panel"><div class="panel-head"><h2>' + esc(s.title) + '</h2></div>' +
    '<div class="lessons">' + list.map(function(x,j){
      const d2 = isDone(t.id, s.id, x.id);
      const openX = topicOpen(x);
      return '<a class="lesson' + (d2?" done":"") + (openX?"":" locked") + '" href="#/app/watch/' + t.id + '/' + s.id + '/' + x.id + '"' +
        (x.id === v.id ? ' style="background:var(--surface-2)"' : '') + '>' +
        '<span class="idx">' + (d2 ? icon("check") : String(j+1)) + '</span>' +
        '<span class="t"><b style="font-size:.85rem">' + esc(x.title) + '</b><small class="num">' + esc(x.dur) + '</small></span>' +
        (openX ? (topicOwned(x) ? '<span class="meta"><span class="pill pill--good">Yours</span></span>' : '')
               : '<span class="meta">' + icon("lock") + '</span>') + '</a>';
    }).join("") + '</div></div>';

  return appShell('<div class="watch"><div>' + main + '</div><div>' + side + '</div></div>',
    "d-library", { back:"#/app/series/" + t.id + "/" + s.id });
}

/* ── certificates ───────────────────────────────────────── */
function viewCerts(){
  const finished = [];
  pubTrainings().forEach(t => pubSeries(t).forEach(s => { if(seriesPct(t,s) === 100) finished.push({t:t, s:s}); }));
  const body = finished.length
    ? '<div class="track-grid">' + finished.map(function(f){
        return '<div class="card pad stack gap-10"><span class="pill pill--brass">' + icon("cert") + 'Completed</span>' +
          '<h3 class="display" style="font-size:1.3rem">' + esc(f.s.title) + '</h3>' +
          '<p class="muted" style="font-size:.85rem">' + esc(f.t.title) + ' · ' + pubTopics(f.s).length + ' topics · ' + esc(f.s.teacher) + '</p>' +
          '<button class="btn btn--ghost btn--sm" style="align-self:flex-start" data-act="cert">Download certificate</button></div>';
      }).join("") + '</div>'
    : '<div class="empty">' + icon("cert") + '<p>Finish every topic in a series and its certificate appears here.</p>' +
      '<a class="btn btn--ghost" href="#/app/library">Choose a series</a></div>';
  return appShell('<div class="page-head"><div><h1>Certificates</h1><p>Issued when a series is fully completed.</p></div></div>' + body, "d-certs");
}

/* ── subscription & profile ─────────────────────────────── */
function viewAccount(){
  const s = State.session;
  const active = subActive();
  const left = active ? daysLeft(s.until) : 0;

  const passes = State.plans.filter(p => p.active !== false).map(function(p){
    const single = p.scope === "topic" || p.billing === "once";
    const running = !single && active && s.plan === p.id;
    return '<div class="plan' + (p.featured && !running ? " plan--feature" : "") + (running ? " plan--running" : "") + '">' +
      '<h3>' + esc(p.name) + '</h3>' +
      '<div class="price"><b>' + peso(p.price) + '</b><span>' + (single ? "per teaching" : "for " + esc(planSpanOf(p.id))) + '</span></div>' +
      '<ul>' + planPerks(p).slice(0,4).map(f=>'<li>' + icon("check") + '<span>' + esc(f) + '</span></li>').join("") + '</ul>' +
      '<div style="margin-top:auto; padding-top:6px">' +
        '<a class="btn btn--block ' + (running || p.featured ? "btn--primary" : "btn--ghost") + '" href="#/checkout/' + p.id + '">' +
          (single ? "Choose a teaching" : running ? "Extend by " + esc(planSpanOf(p.id)) : "Get " + esc(p.name)) + '</a>' +
      '</div></div>';
  }).join("");

  const banner = active
    ? '<div class="sub-banner' + (left <= 3 ? " is-warn" : "") + '">' + icon(left <= 3 ? "clock" : "shield") +
        '<div class="grow"><div class="big">' + planName(s.plan) + ' · running</div>' +
        '<span class="muted" style="font-size:.85rem">' + (left <= 3
          ? "Ends in " + left + " day" + (left === 1 ? "" : "s") + " — subscribe again to keep watching."
          : "Open until " + prettyDate(s.until) + " (" + left + " days left).") + '</span></div>' +
        '<a class="btn btn--primary" href="#/checkout/' + s.plan + '">Extend now</a></div>'
    : (s.plan && s.until
        ? '<div class="sub-banner is-warn">' + icon("clock") +
          '<div class="grow"><div class="big">Your ' + planName(s.plan) + ' has ended</div>' +
          '<span class="muted" style="font-size:.85rem">Closed ' + prettyDate(s.until) + '. Subscribe again to reopen the library.</span></div>' +
          '<a class="btn btn--primary" href="#/checkout/' + s.plan + '">Subscribe again</a></div>'
        : '<div class="sub-banner is-off">' + icon("wallet") +
          '<div class="grow"><div class="big">No subscription running</div>' +
          '<span class="muted" style="font-size:.85rem">Choose one below and the whole library opens.</span></div></div>');

  /* Individual Teaching purchases do not show up in the banner above, because
     they are not a window — but they ARE what some people have paid for, and a
     subscription page that never mentions them looks like the money vanished. */
  const ownedList = ownedTopicList();
  const ownedPanel = ownedList.length
    ? '<div class="panel" style="margin-bottom:24px"><div class="panel-head"><h2>Teachings you own</h2>' +
        '<span class="muted num" style="margin-left:auto; font-size:12px">' + ownedList.length + ' bought outright</span></div>' +
      '<div class="lessons">' + ownedList.map(function(o){
        return '<a class="lesson" href="#/app/watch/' + o.t.id + '/' + o.s.id + '/' + o.v.id + '">' +
          '<span class="idx">' + icon("play") + '</span>' +
          '<span class="t"><b>' + esc(o.v.title) + '</b><small>' + esc(o.t.title) + ' · ' + esc(o.s.title) + '</small></span>' +
          '<span class="meta"><span class="pill pill--good">Yours</span>' +
          '<span class="num">' + esc(o.v.dur) + '</span>' + icon("arrow") + '</span></a>';
      }).join("") + '</div>' +
      '<div class="panel-body"><p class="muted" style="font-size:.82rem">These stay open whether or not a pass is running.</p></div></div>'
    : '';

  const myPays = State.payments.filter(x => (x.email||"").toLowerCase() === (s.email||"").toLowerCase());
  const history =
    '<div class="panel" style="margin-bottom:24px"><div class="panel-head"><h2>Payment history</h2></div>' +
      (myPays.length
        ? '<div class="tbl-wrap"><table><thead><tr><th>Reference</th><th>Subscription</th><th>Method</th><th>Amount</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>' +
          myPays.map(function(p){
            const st = PAY_STATUS[p.status] || PAY_STATUS.pending;
            return '<tr><td><code style="font-size:12px">' + esc(p.ref) + '</code></td>' +
              '<td>' + planName(p.plan) + '<div class="muted" style="font-size:11.5px">' +
                (p.topic ? esc(topicLabel(p.topic)) : planSpanOf(p.plan)) + '</div></td>' +
              '<td>' + PAY_METHOD[p.method].label + '</td><td class="num">' + peso(p.amount) + '</td>' +
              '<td class="num">' + prettyDate(p.created) + '</td>' +
              '<td><span class="pill pill--' + st.cls + '">' + st.label + '</span></td>' +
              '<td style="text-align:right"><a class="btn btn--quiet btn--sm" href="#/receipt/' + p.ref + '">Receipt</a></td></tr>';
          }).join("") + '</tbody></table></div>'
        : '<div class="empty">' + icon("receipt") + '<p>No payments yet.</p></div>') +
    '</div>';

  const billing =
    '<div class="panel" style="margin-bottom:24px"><div class="panel-head"><h2>Access</h2></div>' +
      '<div class="panel-body stack gap-18">' + banner +
        '<div class="plans">' + passes + '</div>' +
        '<p class="muted" style="font-size:.82rem">Each subscription buys one window of access — nothing is charged automatically, ' +
        'and there is no card on file to cancel. Subscribing before yours ends adds to it rather than replacing it.</p>' +
      '</div></div>' + ownedPanel + history;

  const profile =
    '<div class="panel" style="margin-bottom:24px"><div class="panel-head"><h2>Profile</h2></div>' +
      '<div class="panel-body" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px">' +
        '<div class="field"><label for="ac-name">Full name</label><input class="input" id="ac-name" value="' + esc(s.name) + '"></div>' +
        '<div class="field"><label for="ac-email">Email</label><input class="input" id="ac-email" value="' + esc(s.email) + '"></div>' +
        '<div class="field" style="grid-column:1/-1"><button class="btn btn--ghost" style="align-self:flex-start" data-act="save-profile">Save changes</button></div>' +
      '</div></div>';

  const danger =
    '<div class="panel"><div class="panel-head"><h2>Session</h2></div><div class="panel-body row gap-8 wrap">' +
      '<button class="btn btn--ghost" data-act="signout">Sign out</button>' +
      (API.enabled ? '' : '<button class="btn btn--danger" data-act="reset">Reset all demo data</button>') + '</div></div>';

  return appShell('<div class="page-head"><div><h1>Subscription</h1><p>Manage how you access TGFM trainings.</p></div></div>' +
    billing + profile + danger, "d-account");
}
/* ══════════════════════════════════════════════════════════════
   Checkout — plan → method → gateway → receipt
   Manual renewal: one payment buys one window of access.
   With API.enabled the same screens call the PHP endpoints instead
   of the simulator; nothing else in the app changes.
   ══════════════════════════════════════════════════════════════ */

let payMethod = "maya";

function methodCard(id, chosen){
  const m = PAY_METHOD[id];
  return '<button type="button" class="method' + (chosen ? " is-on" : "") + '" data-act="method" data-m="' + id + '" aria-pressed="' + chosen + '">' +
    '<span class="method-mark" style="--brand:' + m.hue + '">' + (id === "maya" ? "maya" : "PayPal") + '</span>' +
    '<span class="grow"><b>' + m.label + '</b><small>' + esc(m.note) + '</small></span>' +
    '<span class="method-tick">' + icon("check") + '</span></button>';
}

/* Wrap a checkout screen in whichever chrome fits: members get the app rail,
   buyers who have no account yet get the public site chrome. */
function payShell(inner, back){
  return State.session.role === "guest"
    ? marketingShell('<div class="shell" style="padding-top:34px; padding-bottom:64px">' + inner + '</div>')
    : appShell(inner, "d-account", { back: back || "#/app/account" });
}

/* The topic a one-off checkout is for, held between renders so choosing one
   from the dropdown does not need a route change. */
let pickedTopic = "";

/* Every published topic, as one grouped <select>. A tree of expanders would be
   prettier and slower to use; on a phone the native picker is the fastest way
   to find one teaching among a hundred. */
function topicPicker(chosen){
  const groups = [];
  pubTrainings().forEach(function(t){
    pubSeries(t).forEach(function(sx){
      const opts = pubTopics(sx).map(function(v){
        const key = t.id + "/" + sx.id + "/" + v.id;
        const owned = (State.owned || []).indexOf(key) >= 0;
        return '<option value="' + esc(key) + '"' + (key === chosen ? ' selected' : '') +
          (owned ? ' disabled' : '') + '>' + esc(v.title) + ' · ' + esc(v.dur) +
          (owned ? ' — already yours' : '') + '</option>';
      }).join("");
      if(opts) groups.push('<optgroup label="' + esc(t.title + " — " + sx.title) + '">' + opts + '</optgroup>');
    });
  });
  if(!groups.length){
    return '<div class="notice notice--bad">' + icon("video") +
      '<span>There are no published teachings to buy yet.</span></div>';
  }
  return '<div class="field"><label for="co-topic">Which teaching are you buying?</label>' +
    '<select class="select" id="co-topic" data-act="pick-topic">' +
      '<option value="">— choose a teaching —</option>' + groups.join("") + '</select>' +
    '<span class="hint">One payment, one teaching, kept for good. Buy as many as you like — they add up in your account.</span></div>';
}

function viewCheckout(planId, tid, sid, vid){
  const plan = passById(planId);
  if(!plan){ go("/pricing"); return ""; }
  const guest = State.session.role === "guest";
  const amount = plan.price;
  const single = plan.scope === "topic" || plan.billing === "once";

  /* A topic named in the URL (from the paywall on a locked video) wins over
     whatever was picked before, so "Buy this teaching" buys THAT one. */
  if(single && tid && sid && vid) pickedTopic = tid + "/" + sid + "/" + vid;
  if(!single) pickedTopic = "";
  const chosen = single && pickedTopic ? pickedTopic : "";

  const running = !single && subActive() && State.session.plan === plan.id;
  const startsFrom = subActive()
    ? new Date(Date.parse(State.session.until + "T00:00:00"))
    : today();
  const until = single ? "" : isoDate(addPeriod(startsFrom, plan.billing));
  const s = State.session;

  const summary =
    '<div class="panel"><div class="panel-head"><h2>Order summary</h2></div>' +
      '<div class="panel-body stack gap-14">' +
        '<div class="row spread gap-12"><span>' + esc(plan.name) + '</span>' +
          '<b class="num">' + peso(amount) + '</b></div>' +
        (single
          ? '<div class="row spread gap-12 muted" style="font-size:.87rem"><span>Teaching</span>' +
              '<span style="text-align:right; max-width:26ch">' + (chosen ? esc(topicLabel(chosen)) : "not chosen yet") + '</span></div>' +
            '<div class="row spread gap-12 muted" style="font-size:.87rem"><span>Open until</span>' +
              '<span>never expires</span></div>'
          : '<div class="row spread gap-12 muted" style="font-size:.87rem"><span>Runs for</span>' +
              '<span>' + esc(planSpanOf(plan.id)) + ', paid once</span></div>' +
            '<div class="row spread gap-12 muted" style="font-size:.87rem"><span>Open until</span>' +
              '<span class="num">' + prettyDate(until) + '</span></div>') +
        (!single && subActive()
          ? '<p class="muted" style="font-size:.82rem">Your current pass runs to ' + prettyDate(State.session.until) +
            '. This one is added on top of it, so no days are lost.</p>' : '') +
        '<hr class="divider">' +
        '<div class="row spread gap-12"><b>Total due today</b><b class="num" style="font-size:1.3rem; font-family:var(--f-display)">' + peso(amount) + '</b></div>' +
        '<div class="stack gap-8" style="margin-top:2px">' +
          State.plans.filter(p => p.id !== plan.id && p.active !== false).map(function(p){
            return '<a class="swap-pass" href="#/checkout/' + p.id + '">' +
              '<span class="grow"><b>' + esc(p.name) + '</b><small>' + esc(planSpanOf(p.id)) + '</small></span>' +
              '<span class="num">' + peso(p.price) + '</span>' + icon("arrow") + '</a>';
          }).join("") +
        '</div>' +
      '</div></div>' +
    '<div class="card pad stack gap-8" style="margin-top:16px">' +
      '<div class="row gap-8" style="color:var(--sage)">' + icon("shield") + '<b style="font-size:.87rem">What this opens</b></div>' +
      '<ul class="stack gap-6" style="font-size:.85rem; color:var(--ink-soft)">' +
        planPerks(plan).map(f=>'<li class="row gap-8" style="align-items:flex-start">' + icon("check") + '<span>' + esc(f) + '</span></li>').join("") +
      '</ul></div>';

  const form =
    '<div class="panel"><div class="panel-head"><h2>Pay with</h2></div>' +
      '<div class="panel-body stack gap-18">' +
        /* Only ever the server's own answer, and only after they have asked.
           Nobody is warned off a purchase on a guess about who they are. */
        (checkoutBlock
          ? '<div class="notice notice--bad">' + icon("shield") +
            '<span>' + esc(checkoutBlock) + ' ' +
            '<a href="#/disciple-signup" style="color:var(--brass); font-weight:600">Register as a disciple</a> ' +
            '— it is free, and you can come straight back.</span></div>'
          : '') +
        (single ? topicPicker(chosen) : '') +
        '<div class="methods">' + methodCard("maya", payMethod==="maya") + methodCard("paypal", payMethod==="paypal") + '</div>' +
        '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px">' +
          '<div class="field"><label for="co-name">Full name</label>' +
            '<input class="input" id="co-name" value="' + esc(s.name) + '" placeholder="Juan dela Cruz" required></div>' +
          '<div class="field"><label for="co-email">Email</label>' +
            '<input class="input" id="co-email" type="email" value="' + esc(s.email) + '" placeholder="you@email.com" required' + (guest ? '' : ' readonly') + '></div>' +
          '<div class="field" style="grid-column:1/-1"><label for="co-phone">Mobile number ' +
            '<span class="muted" style="font-weight:400">(optional)</span></label>' +
            '<input class="input" id="co-phone" placeholder="+63 9XX XXX XXXX"></div>' +
        '</div>' +
        (guest
          ? '<div class="notice" style="background:var(--sage-wash)">' + icon("shield") +
            '<span>This email becomes your account. As soon as the payment clears you pick a password on the ' +
            'next screen — there is no sign-up form to fill in first.</span></div>'
          : '') +
        '<button class="btn btn--primary btn--lg btn--block" data-act="pay" data-plan="' + plan.id + '"' +
          (single && !chosen ? ' disabled' : '') + '>' +
          icon("wallet") + (single && !chosen ? 'Choose a teaching first'
            : 'Pay ' + peso(amount) + ' with ' + PAY_METHOD[payMethod].label) + '</button>' +
        '<p class="muted" style="font-size:.8rem; text-align:center">You will be taken to ' + PAY_METHOD[payMethod].label +
          ' to finish the payment, then brought straight back here.</p>' +
        (API.enabled ? '' :
          '<div class="notice">' + icon("shield") + '<span><b>Demo mode.</b> No money moves and no card is asked for. ' +
          'Set <code>API.enabled = true</code> once the PHP backend is on your server and these same buttons open the real ' +
          'Maya and PayPal checkouts.</span></div>') +
        sandboxHelp() +
      '</div></div>';

  return payShell(
    '<div class="page-head"><div><h1>Checkout</h1><p>' + esc(plan.name) + ' · ' + esc(planSpanOf(plan.id)) +
      (running ? ' · extending your current pass' : '') + '</p></div></div>' +
    '<div class="checkout">' + form + '<div>' + summary + '</div></div>',
    guest ? "#/pricing" : "#/app/account");
}

/* Test credentials, shown only while SANDBOX_HELP is on. These are Maya's own
   published sandbox logins — they buy nothing and belong to nobody. */
function sandboxHelp(){
  if(!API.enabled || !SANDBOX_HELP) return "";
  const rows = payMethod === "maya"
    ? [["Wallet · pays", "+639900100900", "Password@1 · OTP 123456"],
       ["Wallet · declines", "+639900100916", "Password@1 · OTP 123456"],
       ["Card · no 3DS", "4123450131000508", "12/2030 · CVV 111"],
       ["Card · with 3DS", "4123450131001381", "12/2030 · CVV 123 · pw mctest1"]]
    : [["PayPal sandbox", "Your test buyer", "developer.paypal.com → Sandbox Accounts"]];

/* ── starting a payment ─────────────────────────────────── */
async function startPayment(planId){
  const pass = passById(planId);
  if(!pass) return;
  const single = pass.scope === "topic" || pass.billing === "once";
  const period = pass.billing;
  const name  = ($("#co-name")  || {}).value || State.session.name;
  const email = ($("#co-email") || {}).value || State.session.email;
  const phone = ($("#co-phone") || {}).value || "";
  if(!name.trim() || !email.trim()){ toast("Name and email are needed for the receipt"); return; }

  /* A one-off with no topic chosen would take the money and grant nothing.
     The server refuses it too — this is only so nobody reaches the gateway. */
  const key = single ? (($("#co-topic") || {}).value || pickedTopic || "") : "";
  if(single && key.split("/").length !== 3){ toast("Choose which teaching you are buying"); return; }
  const bits = key ? key.split("/") : [];

  const amount = pass.price;
  const ref = newRef();
  const from = subActive() ? new Date(Date.parse(State.session.until + "T00:00:00")) : today();

  const payment = { ref:ref, member:name.trim(), email:email.trim(), phone:phone.trim(),
    plan:planId, amount:amount, method:payMethod, status:"pending", topic:key,
    created:isoDate(today()), until: single ? "" : isoDate(addPeriod(from, period)) };
  State.payments.unshift(payment);
  persist();

  if(API.enabled){
    try{
      const endpoint = payMethod === "maya" ? "/checkout_maya.php" : "/checkout_paypal.php";
      const res = await fetch(API.base + endpoint, {
        method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" },
        /* Only the plan id and, for a one-off, which topic. Never an amount —
           the server reads the price out of the plans table itself. */
        body: JSON.stringify({ plan:planId, name:name, email:email, phone:phone,
          trainingId:bits[0] || "", seriesId:bits[1] || "", topicId:bits[2] || "" })
      });
      const data = await res.json().catch(()=>({}));
      if(data && data.redirectUrl){ location.href = data.redirectUrl; return; }

      /* 403 is the register speaking, and it is not a failed payment — nothing
         was charged and nothing was attempted. Take the placeholder back out,
         say so on the page they are already looking at, and leave them there.
         Sending them to a receipt for a payment that never happened would be
         a lie, and bouncing them to a form would be rude. */
      if(res.status === 403){
        State.payments = State.payments.filter(x => x.ref !== ref);
        persist();
        setCheckoutBlock((data && data.error) || "That email is not on the disciples register yet.");
        /* If they do take the register link, bring them back to this exact
           checkout rather than to the pricing page. */
        setSignupThen("/" + route().join("/"));
        render();
        return;
      }

      payment.status = "failed"; persist();
      toast(data && data.error ? data.error : "The payment gateway did not respond");
      go("/receipt/" + ref); return;
    }catch(err){
      payment.status = "failed"; persist();
      toast("Could not reach the payment server"); go("/receipt/" + ref); return;
    }
  }
  go("/pay/" + ref);
}

/* Stands in for the webhook. A cleared payment is the only thing that opens
   access — on the real site this runs on the server, never in the browser. */
function settlePayment(ref, status){
  const p = State.payments.find(x=>x.ref===ref);
  if(!p) return;
  p.status = status;

  if(status !== "paid"){
    p.until = "";
    persist();
    go("/receipt/" + ref);
    return;
  }

  const email = p.email.toLowerCase();
  const member = State.members.find(m => m.email.toLowerCase() === email);
  const pl = passById(p.plan);
  const single = p.topic || (pl && (pl.scope === "topic" || pl.billing === "once"));

  /* A one-off opens one topic for good and moves no window. Demo mode has to
     behave the same way the server does, or the preview teaches the wrong
     thing about what ₱49 buys. */
  if(single && p.topic){
    if((State.owned || []).indexOf(p.topic) < 0) State.owned = (State.owned || []).concat([p.topic]);
    persist();
    go("/receipt/" + ref);
    return;
  }

  if(member){
    /* Already a member — this pass just extends them. */
    member.plan = p.plan; member.status = "active"; member.last = "Just now";
    if(State.session.email && State.session.email.toLowerCase() === email){
      State.session.plan = p.plan;
      State.session.until = p.until;
    }
  }else{
    /* Nobody by that email yet. The pass is paid and held; the account itself
       is created on the next screen. */
    p.claim = uid("clm");
  }
  persist();
  go("/receipt/" + ref);
}

/* Turning a cleared payment into an account. Single use: the claim token is
   dropped the moment it succeeds. */
async function claimAccount(ref, claim, name, password){
  if(API.enabled){
    try{
      const res = await fetch(API.base + "/create_account.php", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ reference:ref, claim:claim, name:name, password:password })
      });
      const data = await res.json();
      if(data && data.user){
        State.session = { role:data.user.role === "admin" ? "admin" : "disciple",
          name:data.user.name, email:data.user.email, plan:data.user.plan, until:data.user.accessUntil || "" };
        persist();
        /* Re-read the tree as this person. Until now every topic came down
           locked, because there was nobody to unlock it for — and somebody who
           just bought one teaching would otherwise land on a library that still
           says they own nothing. */
        await loadContent();
        toast("Welcome to TGFM, " + String(data.user.name).split(" ")[0]);
        go("/app"); return;
      }
      toast(data && data.error ? data.error : "Could not create the account");
    }catch(err){
      toast("Could not reach the server");
    }
    return;
  }

  const p = State.payments.find(x => x.ref === ref && x.claim === claim && x.status === "paid");
  if(!p){ toast("That link is no longer valid"); return; }
  if(String(password).length < 8){ toast("Use at least 8 characters"); return; }

  const existing = State.members.find(m => m.email.toLowerCase() === p.email.toLowerCase());
  if(existing){
    existing.plan = p.plan; existing.status = "active"; existing.last = "Just now";
  }else{
    State.members.unshift({ id:uid("m"), name:name || p.member, email:p.email, plan:p.plan,
      status:"active", joined:isoDate(today()), last:"Just now", done:0 });
  }

  delete p.claim;
  p.member = name || p.member;
  State.session = { role:"disciple", name:name || p.member, email:p.email, plan:p.plan, until:p.until };
  persist();
  toast("Welcome to TGFM, " + (name || p.member).split(" ")[0]);
  go("/app");
}

function recentJoins(){
  const cut = Date.now() - 60*24*3600*1000;
  return State.members.filter(m => Date.parse(m.joined) >= cut).length;

/* When the access date is not on the row itself, take it from the newest
   cleared payment against that email rather than inventing one. */
function memberUntil(m){
  if(m.until) return m.until;
  const mine = State.payments
    .filter(p => p.status === "paid" && (p.email||"").toLowerCase() === (m.email||"").toLowerCase())
    .sort((a,b) => String(b.until).localeCompare(String(a.until)));
  return mine.length ? mine[0].until : "";
}
function memberPasses(m){
  if(m.paid != null) return m.paid;
  return State.payments.filter(p => p.status === "paid" &&
    (p.email||"").toLowerCase() === (m.email||"").toLowerCase()).length;
}

/* ── admin: members ─────────────────────────────────────── */
function viewMembers(){
  const q = State.ui.q.toLowerCase();
  const list = State.members.filter(m => !q || m.name.toLowerCase().includes(q) || m.email.toLowerCase().includes(q));
  /* Only two states exist on a real install — access runs, or it has run out.
     There is no auto-renewal, so nothing sits "pending" or "cancelled". */
  const keys = API.enabled ? ["active","lapsed"] : ["active","pending","lapsed","cancelled"];
  const counts = keys.map(k=>({k:k, n:State.members.filter(m=>m.status===k).length}));

  /* "Last active" and "Topics completed" used to live here. Both were invented:
     progress is kept per browser, so the server cannot know either one for
     anybody but the person sitting in front of it. Replaced with two things
     that are actually true of every row. */
  const head = '<tr><th>Disciple</th><th>Subscription</th><th>Status</th><th>Joined</th>' +
    '<th>Access until</th><th>Passes bought</th><th></th></tr>';

  const body =
    '<div class="stats" style="margin-bottom:22px">' +
      counts.map(c=>statCard(STATUS[c.k].label, c.n, "accounts")).join("") + '</div>' +
    '<div class="panel"><div class="panel-head"><h2>All disciples</h2>' +
      '<span class="muted num" style="margin-left:auto; font-size:12px">' + list.length + ' shown</span></div>' +
      (list.length
        ? '<div class="tbl-wrap"><table><thead>' + head + '</thead><tbody>' +
          list.map(function(m){
            const st = STATUS[m.status] || STATUS.active;
            /* The access date is the whole subscription, so on a real install
               it is editable here — that is the lever behind a refund or a
               goodwill extension. */
            const until = memberUntil(m);
            const mid = API.enabled
              ? '<td><input class="input" type="date" value="' + esc(until) + '" ' +
                  'style="padding:.3em .5em; font-size:.8rem; width:auto" ' +
                  'data-act="member-until" data-m="' + esc(m.id) + '"></td>'
              : '<td class="num">' + (until ? prettyDate(until) : "—") + '</td>';
            return '<tr><td><div class="who"><span class="avatar">' + initials(m.name) + '</span>' +
                '<div><b>' + esc(m.name) + '</b><small>' + esc(m.email) + '</small>' +
                (m.role === "admin" ? '<small><span class="pill pill--sage">Administrator</span></small>' : '') +
                '</div></div></td>' +
              '<td><select class="select" style="padding:.3em 26px .3em .55em; font-size:.8rem; width:auto; background-position:calc(100% - 13px) 52%, calc(100% - 8px) 52%" data-act="member-plan" data-m="' + esc(m.id) + '">' +
                State.plans.map(p=>'<option value="' + p.id + '"' + (m.plan===p.id?' selected':'') + '>' + esc(p.name) + '</option>').join("") + '</select></td>' +
              '<td><span class="pill pill--' + st.cls + '">' + st.label + '</span></td>' +
              '<td class="num">' + esc(m.joined) + '</td>' + mid +
              '<td class="num">' + memberPasses(m) + '</td>' +
              '<td style="text-align:right"><button class="btn btn--quiet btn--sm" data-act="del-member" data-m="' + esc(m.id) + '" title="Remove">' + icon("trash") + '</button></td></tr>';
          }).join("") + '</tbody></table></div>'
        : '<div class="empty">' + icon("users") +
          '<p>' + (State.members.length ? "No disciples match that search."
                 : "No accounts yet.") + '</p>' +
          (State.members.length ? '' :
            '<p class="muted" style="font-size:.85rem; max-width:44ch">There is no sign-up form — an account is created when somebody pays. ' +
            'The first disciple appears here the moment their payment clears.</p>') + '</div>') +
    '</div>';

  const active = State.members.filter(m=>m.status==="active").length;
  return appShell('<div class="page-head"><div><h1>Disciples</h1><p>' + State.members.length + ' account' +
    (State.members.length === 1 ? "" : "s") + ' · ' + active + ' with access running</p></div></div>' +
    storageNotice() + body, "a-members");
}

/* ── admin: payments ────────────────────────────────────── */
function viewAdminPayments(){
  const q = State.ui.q.toLowerCase();
  const all = State.payments.filter(p => !q || p.ref.toLowerCase().includes(q) ||
    p.member.toLowerCase().includes(q) || p.email.toLowerCase().includes(q));
  const paid = State.payments.filter(p=>p.status==="paid");
  const collected = paid.reduce((a,p)=>a+p.amount, 0);
  const viaMaya = paid.filter(p=>p.method==="maya").reduce((a,p)=>a+p.amount,0);
  const viaPaypal = paid.filter(p=>p.method==="paypal").reduce((a,p)=>a+p.amount,0);
  const failed = State.payments.filter(p=>p.status==="failed" || p.status==="cancelled").length;

  const stats =
    '<div class="stats" style="margin-bottom:22px">' +
      statCard("Collected", peso(collected), paid.length + " successful payments") +
      statCard("Through Maya", peso(viaMaya), Math.round(collected ? viaMaya/collected*100 : 0) + "% of takings") +
      statCard("Through PayPal", peso(viaPaypal), Math.round(collected ? viaPaypal/collected*100 : 0) + "% of takings") +
      statCard("Did not complete", failed, failed ? "Failed or cancelled" : "None", failed ? "down" : "") +
    '</div>';

  const table =
    '<div class="panel"><div class="panel-head"><h2>All payments</h2>' +
      '<span class="muted num" style="margin-left:auto; font-size:12px">' + all.length + ' shown</span></div>' +
      (all.length
        ? '<div class="tbl-wrap"><table><thead><tr><th>Reference</th><th>Disciple</th><th>Subscription</th><th>Method</th>' +
          '<th>Amount</th><th>Date</th><th>Open until</th><th>Status</th><th></th></tr></thead><tbody>' +
          all.map(function(p){
            const st = PAY_STATUS[p.status] || PAY_STATUS.pending;
            return '<tr><td><code style="font-size:12px">' + esc(p.ref) + '</code></td>' +
              '<td><b>' + esc(p.member) + '</b><div class="muted" style="font-size:11.5px">' + esc(p.email) + '</div></td>' +
              '<td>' + planName(p.plan) + '<div class="muted" style="font-size:11.5px; max-width:32ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">' +
                (p.topic ? esc(topicLabel(p.topic)) : planSpanOf(p.plan)) + '</div></td>' +
              '<td><span class="pill pill--mute">' + PAY_METHOD[p.method].label + '</span></td>' +
              '<td class="num">' + peso(p.amount) + '</td>' +
              '<td class="num">' + prettyDate(p.created) + '</td>' +
              '<td class="num">' + (p.topic ? "never expires" : p.until ? prettyDate(p.until) : "—") + '</td>' +
              '<td><span class="pill pill--' + st.cls + '">' + st.label + '</span></td>' +
              '<td style="text-align:right; white-space:nowrap">' +
                '<a class="btn btn--quiet btn--sm" href="#/receipt/' + esc(p.ref) + '" title="Receipt">' + icon("receipt") + '</a>' +
                '<button class="btn btn--quiet btn--sm" data-act="del-payment" data-ref="' + esc(p.ref) + '" title="Delete this record">' +
                  icon("trash") + '</button></td></tr>';
          }).join("") + '</tbody></table></div>'
        : '<div class="empty">' + icon("receipt") +
          '<p>' + (State.payments.length ? "No payments match that search." : "No payments yet.") + '</p></div>') +
    '</div>';

  return appShell('<div class="page-head"><div><h1>Payments</h1>' +
    '<p>Every Maya and PayPal transaction against TGFM trainings. Deleting a record removes the paperwork, ' +
    'not the access — change that on the Disciples page.</p></div></div>' +
    storageNotice() + stats + table, "a-payments");
}

/* ── admin: subscriptions ─────────────────────────────────
   The ministry sets its own prices here. Nothing on this screen sends an
   amount to a checkout — it writes the plans table, and the checkout reads
   that table on the server. Changing a price changes what the NEXT buyer is
   charged, and leaves every receipt already written alone. */
const BILLING_LABEL = { once:"One-time", week:"Weekly", month:"Monthly", year:"Annual" };

function viewAdminPlans(){
  const plans = State.plans || [];
  const live = plans.filter(p => p.active !== false).length;

  const rows = plans.map(function(p, i){
    const single = p.scope === "topic" || p.billing === "once";
    /* Per-month is a comparison between passes. A one-off is not a rate, and
       printing one would invite comparing ₱49 with ₱299 as if they were. */
    const perMonth = single ? null
      : p.billing === "week" ? p.price * 52 / 12
      : p.billing === "year" ? p.price / 12 : p.price;
    const sold = p.sold != null
      ? p.sold
      : State.payments.filter(x => x.plan === p.id && x.status === "paid").length;
    return '<tr>' +
      '<td><b>' + esc(p.name) + '</b>' +
        '<div class="muted" style="font-size:11.5px; max-width:46ch">' + esc(p.blurb || "") + '</div>' +
        '<code class="num" style="font-size:11px; opacity:.65">' + esc(p.id) + '</code></td>' +
      '<td class="num">' + peso(p.price) + '</td>' +
      '<td>' + esc(BILLING_LABEL[p.billing] || p.billing) +
        '<div class="muted" style="font-size:11.5px">' + (single ? "one topic" : "everything") + '</div></td>' +
      '<td class="num muted">' + (perMonth == null ? "—" : peso(Math.round(perMonth))) + '</td>' +
      '<td class="num">' + sold + '</td>' +
      '<td><button class="pill pill--' + (p.active !== false ? "good" : "warn") + '" data-act="toggle-plan" data-p="' + esc(p.id) + '" style="border:0;cursor:pointer">' +
        (p.active !== false ? "On sale" : "Withdrawn") + '</button></td>' +
      '<td style="text-align:right; white-space:nowrap">' +
        '<button class="btn btn--quiet btn--sm" data-act="edit-plan" data-p="' + esc(p.id) + '" title="Edit">' + icon("edit") + '</button>' +
        '<button class="btn btn--quiet btn--sm" data-act="move-plan" data-p="' + esc(p.id) + '" data-dir="-1" title="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button class="btn btn--quiet btn--sm" data-act="move-plan" data-p="' + esc(p.id) + '" data-dir="1" title="Move down"' + (i === plans.length-1 ? ' disabled' : '') + '>↓</button>' +
        '<button class="btn btn--quiet btn--sm" data-act="del-plan" data-p="' + esc(p.id) + '" title="Delete">' + icon("trash") + '</button>' +
      '</td></tr>';
  }).join("");

  const table =
    '<div class="panel" style="margin-bottom:22px"><div class="panel-head"><h2>Subscriptions</h2>' +
      '<span class="muted num" style="margin-left:auto; font-size:12px">' + live + ' of ' + plans.length + ' on sale</span>' +
      '<div class="actions"><button class="btn btn--primary btn--sm" data-act="new-plan">' + icon("plus") + 'New subscription</button></div></div>' +
      (plans.length
        ? '<div class="tbl-wrap"><table><thead><tr><th>Subscription</th><th>Price</th><th>Billing</th>' +
          '<th>Per month</th><th>Bought</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">' + icon("card") + '<p>No subscriptions yet — nobody can buy anything.</p>' +
          '<button class="btn btn--primary btn--sm" data-act="new-plan">' + icon("plus") + 'New subscription</button></div>') +
    '</div>';

  const help =
    '<div class="panel"><div class="panel-head"><h2>How these work</h2></div>' +
      '<div class="panel-body stack gap-12" style="font-size:.88rem; color:var(--ink-soft)">' +
        '<p><b>A pass</b> — weekly, monthly or annual — opens every training, every series and every topic for as ' +
        'long as it runs. Buying one while another is still going adds to it rather than replacing it.</p>' +
        '<p><b>A one-time subscription</b> sells a single teaching. The buyer chooses which topic at checkout, it ' +
        'never expires, and buying several adds them up. That is the only kind that asks the buyer to pick a topic.</p>' +
        '<p><b>Changing a price</b> takes effect on the next checkout. Payments already taken keep the amount that ' +
        'was actually charged — a receipt never changes under the person holding it.</p>' +
        '<p><b>Deleting</b> is only possible while nothing has been bought on that plan; after that, its receipts ' +

/* ══════════════════════════════════════════════════════════════════════════
   THE DISCIPLES REGISTER

   Free, and now the first step. A registration is not an account: it has no
   password and opens nothing. It is the ministry's record of a person — their
   pastor, where they are, the year they attended Divine Encounter — and it is
   what a subscription is now gated on, so TGFM always knows who is on the
   other side of a payment.

   The funnel is therefore:

       register (free)  →  subscribe  →  pay  →  choose a password

   The gate below is a courtesy: it keeps somebody from reaching a payment page
   they would be turned away from. The rule itself lives in checkout_maya.php
   and checkout_paypal.php, where the browser cannot argue with it.
   ══════════════════════════════════════════════════════════════════════════ */

const GENDERS = ["Male", "Female"];

/* Where to send them once they have registered — set when the gate turns them
   away from a plan, so finishing the form drops them back on that checkout
   rather than on a page with no next step.

   Kept in sessionStorage as well as in memory: somebody who is handed the
   /disciple-signup link and opens it fresh has reloaded the document, and an
   intent that only lived in a variable would be gone. Per-tab, cleared the
   moment it is used, and every access is wrapped — a browser with site data
   switched off must still be able to register. */
const THEN_KEY = "tgfm.signupThen";
let signupThenMem = "";

function setSignupThen(hash){
  signupThenMem = hash || "";
  try{ hash ? sessionStorage.setItem(THEN_KEY, hash) : sessionStorage.removeItem(THEN_KEY); }catch(e){}
}
function takeSignupThen(){
  let v = signupThenMem;
  if(!v){ try{ v = sessionStorage.getItem(THEN_KEY) || ""; }catch(e){ v = ""; } }
  setSignupThen("");
  return v;
}

function isRegistered(){
  /* Demo mode has no server to register against, so the gate stands down
     rather than making the prototype unusable. */
  if(!API.enabled) return true;
  return !!State.discipleMe;
}

/* Why there is no gate in front of the checkout any more.
   ────────────────────────────────────────────────────────────────────────
   Sending somebody to a sign-up form before they have said who they are is
   guesswork: a disciple who registered months ago on another phone gets
   bounced for no reason, and a genuinely new person is asked to fill a form
   before they know what they are buying.

   So the checkout takes their email like it always did, and the SERVER
   answers the only question that matters — is this address on the register?
   A yes goes straight through to Maya. A no comes back as a message on the
   checkout itself, with a link they can take if they want it. Nobody is moved
   anywhere they did not ask to go. */

/* Set when the server says the email at the checkout is not on the register.
   Cleared on the way into any screen, so it never outlives the attempt. */
let checkoutBlock = "";
function setCheckoutBlock(msg){ checkoutBlock = msg || ""; }

/* ── admin: registered disciples ──────────────────────────────────────────

function viewAdminDisciples(){
  const q    = (State.ui.q || "").toLowerCase();
  const all  = State.disciples || [];
  const list = all.filter(d => !q ||
    (d.name || "").toLowerCase().includes(q) ||
    (d.email || "").toLowerCase().includes(q) ||
    (d.pastor || "").toLowerCase().includes(q) ||

  const pastors = {};
  all.forEach(d => { pastors[d.pastor || "—"] = (pastors[d.pastor || "—"] || 0) + 1; });
  const ranked = Object.keys(pastors).sort((a, b) => pastors[b] - pastors[a]);

  const topIsReal = topPastor && pastors[topPastor] > 1;

/* ── router ─────────────────────────────────────────────────────────────
   Real addresses. See CLEAN_URLS and routeOf() in the helpers above for how
   the path is read and what happens when there is no server to rewrite it. */
function route(){ return routeOf(); }

/* A link from before the change — a bookmark, an old email — arrives as
   "/#/pricing". Turn it into "/pricing" on the way in and carry on. Nothing
   that used to work stops working; it just tidies itself up. */
function adoptLegacyHash(){
  if(!CLEAN_URLS) return false;
  const h = location.hash || "";
  if(h.length < 2 || h.charAt(1) !== "/") return false;
  try{
    history.replaceState(null, "", appBase() + h.slice(1) + location.search);
  }catch(e){
    return false;
  }
  return true;
}

/* Every internal link is an ordinary <a href="/pricing"> — right-click and
   copy gives a real address, and a middle-click opens a real tab. This only turns
   a plain left-click into a route change instead of a page load. */
document.addEventListener("click", function(e){
  if(!CLEAN_URLS) return;
  if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest && e.target.closest("a[href]");
  if(!a || a.target === "_blank" || a.hasAttribute("download")) return;

  const href = a.getAttribute("href") || "";
  if(/^(https?:|mailto:|tel:)/i.test(href) || href.charAt(0) === "#") return;

  const b = appBase();
  if(href.indexOf(b + "/") !== 0) return;
  const rest = href.slice(b.length);
  /* The backend and the uploaded images are real files — never intercepted. */
  if(rest.indexOf("/api/") === 0 || rest.indexOf("/uploads/") === 0) return;

  e.preventDefault();
  go(rest);
});

/* Turn the #/ links the views emit into real addresses, once per paint. Doing
   it here rather than in sixty template strings means a link added later is
   converted too, and the views stay readable. */
function cleanLinks(root){
  if(!CLEAN_URLS) return;
  const b = appBase();
  $$('a[href^="#/"]', root).forEach(function(a){
    a.setAttribute("href", b + a.getAttribute("href").slice(1));
  });
}

function afterRender(root){
  cleanLinks(root);
  mountCanvases(root);
  if($("#heroCanvas")) paintHero($("#heroCanvas"));
  document.title = SEED.org.short;
  mountLanding(root);
  /* A nav click that asked for a section on the home page has to wait until
     the home page exists — this is the other half of that. */
  if(pendingScroll){
    const id = pendingScroll; pendingScroll = "";
    requestAnimationFrame(()=> scrollToSection(id));
    return;
  }
  window.scrollTo({ top:0 });
}

/* ── the home page's own behaviour ────────────────────────────────────────
   Three small things, all of which degrade to nothing if the browser or the
   viewer would rather not have them. */
let pendingScroll = "";
let revealWatcher = null;
let stickyWatcher = false;

function scrollToSection(id){
  const el = document.getElementById(id);
  if(!el){ window.scrollTo({ top:0 }); return; }
  el.scrollIntoView({ behavior:"smooth", block:"start" });
}

function mountLanding(root){
  const bar = $("#mk-nav", root) || $("#mk-nav");
  if(bar && !stickyWatcher){
    stickyWatcher = true;
    const onScroll = () => {
      const el = $("#mk-nav");
      if(el) el.classList.toggle("is-stuck", window.scrollY > 24);
    };
    window.addEventListener("scroll", onScroll, { passive:true });
    onScroll();
  }else if(bar){
    bar.classList.toggle("is-stuck", window.scrollY > 24);
  }

  const items = $$(".lp-in", root);
  if(!items.length) return;

  /* Without IntersectionObserver everything is simply shown. A page that
     stays invisible is a far worse outcome than one that does not animate. */
  if(typeof IntersectionObserver !== "function"){
    items.forEach(el => el.classList.add("is-on"));
    return;
  }
  if(revealWatcher) revealWatcher.disconnect();
  revealWatcher = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add("is-on"); revealWatcher.unobserve(e.target); }
    });
  }, { threshold:0.15 });
  items.forEach(el => revealWatcher.observe(el));

  /* Anything already on screen at paint time gets no scroll event, so show it
     straight away rather than waiting for a scroll that may never come. */
  requestAnimationFrame(function(){
    items.forEach(function(el){
      const r = el.getBoundingClientRect();
      if(r.top < window.innerHeight && r.bottom > 0) el.classList.add("is-on");
    });
  });
}

/* The weave behind the hero: sky blue threads that warm into the logo's gold
   as they travel right, like the lightning in the mark. */
function paintHero(cv){
  const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight;
  if(!w || !h) return;
  const g = cv.getContext("2d");
  const dark = isDark();
  g.clearRect(0,0,w,h);
  g.lineWidth = 1;
  for(let i=0;i<26;i++){
    const t = i / 25;
    const k = dark ? 1 : 0.65;   // the weave sits lighter on a white ground
    const grd = g.createLinearGradient(0,0,w,0);
    grd.addColorStop(0,   "rgba(" + (dark ? "142,179,231," : "66,86,122,")  + ((0.05 + t*0.14) * k).toFixed(3) + ")");
    grd.addColorStop(0.6, "rgba(" + (dark ? "88,112,151,"  : "66,86,122,")  + ((0.10 + t*0.12) * k).toFixed(3) + ")");
    grd.addColorStop(1,   "rgba(" + (dark ? "255,179,92,"  : "176,116,26,") + ((0.06 + t*0.20) * k).toFixed(3) + ")");
    g.strokeStyle = grd;
    g.beginPath();
    const y = h*.15 + i*(h*.75/26);
    g.moveTo(0, y);
    for(let x=0; x<=w; x+=14){
      g.lineTo(x, y + Math.sin((x/w)*Math.PI*2 + i*.28) * (10 + i*1.1) * (x/w));
    }
    g.stroke();
  }
}

/* ── theme ──────────────────────────────────────────────────
   System -> Dark -> Light -> System. Remembered per browser; "system" means
   no stamp at all, so prefers-color-scheme decides. */
const THEME_KEY = "tgfm.theme";
function applyTheme(mode){
  if(mode === "dark" || mode === "light") document.documentElement.setAttribute("data-theme", mode);
  else document.documentElement.removeAttribute("data-theme");
  try{ mode ? localStorage.setItem(THEME_KEY, mode) : localStorage.removeItem(THEME_KEY); }catch(e){}
}
function loadTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  applyTheme(saved === "dark" || saved === "light" ? saved : null);
}
function cycleTheme(){
  const now = document.documentElement.getAttribute("data-theme") || "system";
  applyTheme(now === "system" ? "dark" : now === "dark" ? "light" : null);
  render();
}

function signInAs(id){
  if(id === "admin"){
    State.session = { role:"admin", name:"TGFM Admin", email:"admin@tgfm.org", plan:"year", until:"2099-12-31" };
    persist(); toast("Signed in as administrator"); go("/admin"); return;
  }
  const m = State.members.find(x=>x.id===id) || State.members[0];
  const last = State.payments.filter(p => p.status === "paid" &&
    p.email.toLowerCase() === m.email.toLowerCase()).sort((a,b)=>b.until.localeCompare(a.until))[0];
  State.session = { role:"disciple", name:m.name, email:m.email, plan:m.plan, until: last ? last.until : "" };
  if(id === "m1" && !Object.keys(State.progress).length){
    ["t1/se1/v1","t1/se1/v2","t3/se1/v1"].forEach(k=>State.progress[k]=true);
  }
  persist(); toast("Welcome back, " + m.name.split(" ")[0]); go("/app");
}

/* ── actions ────────────────────────────────────────────── */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act;
  const T = () => findTraining(el.dataset.t);
  const S = () => findSeries(el.dataset.t, el.dataset.s);

  if(a === "close-modal" && e.target.closest(".modal") && !el.classList.contains("btn")) return;

  switch(a){
    case "theme": cycleTheme(); return;

    /* One nav link, two jobs: scroll to the section when the home page is
       already on screen, otherwise go where the label actually points — and
       when it points at a section that only exists at home, go home first and
       scroll once it has painted. */
    case "lp-nav": {
      const to   = el.dataset.to || "";
      /* Named `dest`, not `route` — a local called `route` shadows the
         route() function for the whole block, and the home-only links then
         silently do nothing. */
      const dest = el.dataset.route || "";
      e.preventDefault();
      if(document.getElementById(to)){ scrollToSection(to); return; }
      if(dest && dest !== "/"){ go(dest); return; }
      pendingScroll = to;
      if(route().length === 0){ render(); } else { go("/"); }
      return;
    }
    case "recheck": {
      /* Ask the server to ask the gateway again. */
      const ref = el.dataset.ref;
      PAYMENT_CHECKED = "";
      render();
      loadPayment(ref).then(function(p){
        render();
        if(p && p.status === "paid"){
          toast("Payment confirmed");
          if(p.claim) go("/create-account/" + p.ref + "/" + p.claim);
        }else{
          toast("Still not confirmed — give it a minute");
        }
      });
      return;
    }
    case "rail": State.ui.rail = !State.ui.rail; render(); return;
    case "reset": resetAll(); return;
    case "signout": signOut(); return;
    case "demo": signInAs(el.dataset.id); return;
    case "choose-plan": go("/checkout/" + el.dataset.plan); return;

    /* ── admin: subscriptions ── */
    case "new-plan":  modal = { kind:"plan" }; render(); return;
    case "edit-plan": modal = { kind:"plan", pid:el.dataset.p }; render(); return;
    case "save-plan": {
      const existing = modal.pid ? planById(modal.pid) : null;
      const id = existing ? existing.id : ($("#mp-id").value || "").trim().toLowerCase();
      const name = $("#mp-name").value.trim();
      const price = $("#mp-price").value;
      if(!id){ toast("Give the subscription a short id"); return; }
      if(!name){ toast("Give the subscription a name buyers will see"); return; }
      const billing = $("#mp-billing").value;
      const plan = { id:id, name:name, price:price, billing:billing,
        scope: billing === "once" ? "topic" : "all",
        blurb:$("#mp-blurb").value.trim(), active:$("#mp-active").checked };
      modal = null;
      savePlan("save_plan", { plan:plan }, existing ? "Subscription saved" : "Subscription created");
      return;
    }
    case "toggle-plan": {
      const p2 = planById(el.dataset.p);
      if(!p2) return;
      const on = p2.active === false;
      savePlan("save_plan", { plan:{ id:p2.id, name:p2.name, price:p2.price, blurb:p2.blurb || "",
        billing:p2.billing, scope:p2.scope, active:on } },
        on ? p2.name + " is back on sale" : p2.name + " withdrawn from sale");
      return;
    }
    case "move-plan": {
      const list = (State.plans || []).slice();
      const i = list.findIndex(x => x.id === el.dataset.p), d = +el.dataset.dir;
      if(i < 0 || i + d < 0 || i + d >= list.length) return;
      const [x] = list.splice(i, 1); list.splice(i + d, 0, x);
      State.plans = list;
      savePlan("reorder", { order:list.map(y => y.id) });
      return;
    }
    case "del-plan": {
      /* Two clicks, because this one can only be undone by typing the plan
         back in. The server refuses outright if anything was bought on it. */
      if(!el.dataset.armed){
        el.dataset.armed = "1";
        el.innerHTML = "Delete?";

    /* ── admin: payments ── */

        el.dataset.armed = "1";

        el.classList.add("btn--danger");

           be at the gateway. Anything else is a real error and stays refused. */

          el.dataset.forced = "1";

      persist(); toast("Profile saved"); render(); return;
