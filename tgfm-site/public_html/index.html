/* The weave behind the hero: sky blue threads that warm into the logo's gold
   as they travel right, like the lightning in the mark. */
function paintHero(cv){
  const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight;
  if(!w || !h) return;
  const g = cv.getContext("2d");
  const dark = isDark();
  g.clearRect(0,0,w,h);
  g.lineWidth = 1;
  for(let i=0;i<26;i++){
    const t = i / 25;
    const k = dark ? 1 : 0.65;   // the weave sits lighter on a white ground
    const grd = g.createLinearGradient(0,0,w,0);
    grd.addColorStop(0,   "rgba(" + (dark ? "142,179,231," : "66,86,122,")  + ((0.05 + t*0.14) * k).toFixed(3) + ")");
    grd.addColorStop(0.6, "rgba(" + (dark ? "88,112,151,"  : "66,86,122,")  + ((0.10 + t*0.12) * k).toFixed(3) + ")");
    grd.addColorStop(1,   "rgba(" + (dark ? "255,179,92,"  : "176,116,26,") + ((0.06 + t*0.20) * k).toFixed(3) + ")");
    g.strokeStyle = grd;
    g.beginPath();
    const y = h*.15 + i*(h*.75/26);
    g.moveTo(0, y);
    for(let x=0; x<=w; x+=14){
      g.lineTo(x, y + Math.sin((x/w)*Math.PI*2 + i*.28) * (10 + i*1.1) * (x/w));
    }
    g.stroke();
  }
}

/* ── theme ──────────────────────────────────────────────────
   System -> Dark -> Light -> System. Remembered per browser; "system" means
   no stamp at all, so prefers-color-scheme decides. */
const THEME_KEY = "tgfm.theme";
function applyTheme(mode){
  if(mode === "dark" || mode === "light") document.documentElement.setAttribute("data-theme", mode);
  else document.documentElement.removeAttribute("data-theme");
  try{ mode ? localStorage.setItem(THEME_KEY, mode) : localStorage.removeItem(THEME_KEY); }catch(e){}
}
function loadTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  applyTheme(saved === "dark" || saved === "light" ? saved : null);
}
function cycleTheme(){
  const now = document.documentElement.getAttribute("data-theme") || "system";
  applyTheme(now === "system" ? "dark" : now === "dark" ? "light" : null);
  render();
}

/* ── sessions ───────────────────────────────────────────── */
function signInAs(id){
  if(id === "admin"){
    State.session = { role:"admin", name:"TGFM Admin", email:"admin@tgfm.org", plan:"year", until:"2099-12-31" };
    persist(); toast("Signed in as administrator"); go("#/admin"); return;
  }
  const m = State.members.find(x=>x.id===id) || State.members[0];
  const last = State.payments.filter(p => p.status === "paid" &&
    p.email.toLowerCase() === m.email.toLowerCase()).sort((a,b)=>b.until.localeCompare(a.until))[0];
  State.session = { role:"disciple", name:m.name, email:m.email, plan:m.plan, until: last ? last.until : "" };
  if(id === "m1" && !Object.keys(State.progress).length){
    ["t1/se1/v1","t1/se1/v2","t3/se1/v1"].forEach(k=>State.progress[k]=true);
  }
  persist(); toast("Welcome back, " + m.name.split(" ")[0]); go("#/app");
}
async function signOut(){
  if(API.enabled){ try{ await apiPost("/auth.php?do=logout", {}); }catch(e){} }
  State.session = { role:"guest", name:"", email:"", plan:"", until:"" };
  persist(); toast("Signed out"); go("#/");
}

/* ── actions ────────────────────────────────────────────── */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act;
  const T = () => findTraining(el.dataset.t);
  const S = () => findSeries(el.dataset.t, el.dataset.s);

  if(a === "close-modal" && e.target.closest(".modal") && !el.classList.contains("btn")) return;

  switch(a){
    case "theme": cycleTheme(); return;
    case "recheck": {
      /* Ask the server to ask the gateway again. */
      const ref = el.dataset.ref;
      PAYMENT_CHECKED = "";
      render();
      loadPayment(ref).then(function(p){
        render();
        if(p && p.status === "paid"){
          toast("Payment confirmed");
          if(p.claim) go("#/create-account/" + p.ref + "/" + p.claim);
        }else{
          toast("Still not confirmed — give it a minute");
        }
      });
      return;
    }
    case "rail": State.ui.rail = !State.ui.rail; render(); return;
    case "reset": resetAll(); return;
    case "signout": signOut(); return;
    case "demo": signInAs(el.dataset.id); return;
    case "choose-plan": go("#/checkout/" + el.dataset.plan); return;

    /* payments */
    case "method": payMethod = el.dataset.m; render(); return;
    case "pay": startPayment(el.dataset.plan); return;
    case "gw-approve": settlePayment(el.dataset.ref, "paid"); return;
    case "gw-fail":    settlePayment(el.dataset.ref, "failed"); return;
    case "gw-cancel":  settlePayment(el.dataset.ref, "cancelled"); return;
    case "print": window.print(); return;
    case "save-profile": {
      State.session.name = $("#ac-name").value.trim() || State.session.name;
      State.session.email = $("#ac-email").value.trim() || State.session.email;
      persist(); toast("Profile saved"); render(); return;
    }

    case "play": playing = true; render(); return;
    case "toggle-done": {
      const k = el.dataset.key;
      State.progress[k] = !State.progress[k];
      persist(); toast(State.progress[k] ? "Topic marked complete" : "Marked as not finished"); render(); return;
    }
    case "cert": toast("Certificate PDF generates once the backend is connected"); return;

    /* ── admin: trainings ── */
    case "new-training": modal = { kind:"training" }; render(); return;
    case "create-training": {
      const title = $("#mt-title").value.trim();
      if(!title){ toast("Give the training a name"); return; }
      const t = { id:uid("t"), title:title, blurb:$("#mt-blurb").value.trim() || "New training.",
        hue: Math.floor(Math.random()*360), published:false, series:[] };
      if(!API.enabled) State.trainings.push(t);
      modal = null;
      saveContent("create_training", { training:t }, "Training created as a draft");
      return;
    }
    case "save-training": {
      const t = T();
      t.title = $("#tk-title").value.trim() || t.title;
      t.blurb = $("#tk-blurb").value.trim();
      t.hue = +$("#tk-hue").value;
      saveContent("save_training", { training:{ id:t.id, title:t.title, blurb:t.blurb, hue:t.hue, published:t.published } }, "Training saved");
      return;
    }
    case "toggle-training-pub": {
      const t = T(); t.published = !t.published;
      saveContent("save_training", { training:{ id:t.id, title:t.title, blurb:t.blurb, hue:t.hue, published:t.published } },
        t.published ? "Training is now live" : "Training unpublished");
      return;
    }
    case "del-training": {
      if(!el.dataset.armed){ el.dataset.armed = "1"; el.textContent = "Click again to delete"; return; }
      const id = el.dataset.t;
      if(!API.enabled) State.trainings = State.trainings.filter(x=>x.id!==id);
      saveContent("delete_training", { id:id }, "Training deleted").then(()=>go("#/admin/trainings"));
      return;
    }

    /* ── admin: series ── */
    case "new-series": modal = { kind:"series", tid:el.dataset.t }; render(); return;
    case "create-series": {
      const t = findTraining(modal.tid);
      const title = $("#ms-title").value.trim();
      if(!title){ toast("Give the series a name"); return; }
      const s = { id:uid("se"), title:title, blurb:$("#ms-blurb").value.trim() || "",
        teacher:$("#ms-teacher").value, published:false, topics:[] };
      if(!API.enabled) t.series.push(s);
      modal = null;
      saveContent("create_series", { trainingId:t.id, series:s }, "Series created as a draft");
      return;
    }
    case "save-series": {
      const s = S();
      s.title = $("#sr-title").value.trim() || s.title;
      s.blurb = $("#sr-blurb").value.trim();
      s.teacher = $("#sr-teacher").value;
      saveContent("save_series", { trainingId:el.dataset.t, series:{ id:s.id, title:s.title, blurb:s.blurb, teacher:s.teacher, published:s.published } }, "Series saved");
      return;
    }
    case "toggle-series-pub": {
      const s = S(); s.published = !s.published;
      saveContent("save_series", { trainingId:el.dataset.t, series:{ id:s.id, title:s.title, blurb:s.blurb, teacher:s.teacher, published:s.published } },
        s.published ? "Series published" : "Series moved to draft");
      return;
    }
    case "move-series": {
      const t = T(), i = t.series.findIndex(x=>x.id===el.dataset.s), d = +el.dataset.dir;
      if(i + d < 0 || i + d >= t.series.length) return;
      const [x] = t.series.splice(i,1); t.series.splice(i+d, 0, x);
      saveContent("reorder_series", { trainingId:t.id, order:t.series.map(y=>y.id) });
      return;
    }
    case "del-series": {
      if(!el.dataset.armed){ el.dataset.armed = "1"; el.textContent = "Click again"; return; }
      const t = T(), sid = el.dataset.s;
      if(!API.enabled) t.series = t.series.filter(x=>x.id!==sid);
      saveContent("delete_series", { trainingId:t.id, id:sid }, "Series deleted").then(()=>go("#/admin/training/" + t.id));
      return;
    }

    /* ── admin: topics ── */
    case "new-topic": ytLive = false; modal = { kind:"topic", tid:el.dataset.t, sid:el.dataset.s }; render(); return;
    case "edit-topic": ytLive = false; modal = { kind:"topic", tid:el.dataset.t, sid:el.dataset.s, vid:el.dataset.v }; render(); return;
    case "yt-load": { ytLive = true; const box = $("#yt-preview"); if(box) box.innerHTML = ytPreview($("#ml-url").value); return; }
    case "close-modal": modal = null; render(); return;
    case "create-topic":
    case "update-topic": {
      const tid = modal.tid, sid = modal.sid, vid = modal.vid;
      const s = findSeries(tid, sid);
      const yt = YT.parse($("#ml-url").value);
      const title = $("#ml-title").value.trim();
      if(!yt){ toast("That link has no YouTube video ID"); return; }
      if(!title){ toast("Give the topic a title"); return; }
      const payload = { yt:yt, title:title, dur:($("#ml-dur").value.trim() || "00:00"),
        note:$("#ml-note").value.trim(), published:$("#ml-pub").checked };
      const creating = a === "create-topic";
      const topic = Object.assign({ id: creating ? uid("v") : vid }, payload);
      if(!API.enabled){
        if(creating) s.topics.push(topic);
        else Object.assign(s.topics.find(x=>x.id===vid), payload);
      }
      modal = null;
      saveContent(creating ? "create_topic" : "save_topic",
        { trainingId:tid, seriesId:sid, topic:topic }, creating ? "Topic added" : "Topic updated");
      return;
    }
    case "toggle-topic-pub": {
      const s = S(), v = s.topics.find(x=>x.id===el.dataset.v);
      v.published = !v.published;
      saveContent("save_topic", { trainingId:el.dataset.t, seriesId:el.dataset.s, topic:v },
        v.published ? "Topic published" : "Topic moved to draft");
      return;
    }
    case "move-topic": {
      const s = S(), i = s.topics.findIndex(x=>x.id===el.dataset.v), d = +el.dataset.dir;
      if(i + d < 0 || i + d >= s.topics.length) return;
      const [x] = s.topics.splice(i,1); s.topics.splice(i+d, 0, x);
      saveContent("reorder_topics", { trainingId:el.dataset.t, seriesId:s.id, order:s.topics.map(y=>y.id) });
      return;
    }
    case "del-topic": {
      const s = S();
      if(!API.enabled) s.topics = s.topics.filter(x=>x.id!==el.dataset.v);
      saveContent("delete_topic", { trainingId:el.dataset.t, seriesId:s.id, id:el.dataset.v }, "Topic removed");
      return;
    }

    case "del-member": {
      if(!API.enabled) State.members = State.members.filter(m=>m.id!==el.dataset.m);
      saveMember("delete", { id:el.dataset.m }, "Disciple removed");
      return;
    }
  }
});

/* input / change */
document.addEventListener("input", function(e){
  const el = e.target;
  if(el.dataset.act === "yt-input"){
    const box = $("#yt-preview"); if(box) box.innerHTML = ytPreview(el.value);
    return;
  }
  if(el.dataset.act === "note"){ State.notes[el.dataset.key] = el.value; persist(); return; }
  if(el.dataset.act === "search"){
    State.ui.q = el.value.trim();
    clearTimeout(window.__qt);
    window.__qt = setTimeout(function(){
      const pos = el.selectionStart; render();
      const again = $('[data-act="search"]'); if(again){ again.focus(); again.setSelectionRange(pos,pos); }
    }, 260);
    return;
  }
  if(el.dataset.act === "hue"){
    const t = findTraining(el.dataset.t);
    t.hue = +el.value;
    const cv = $(".panel canvas[data-hue]"); if(cv){ cv.dataset.hue = t.hue; paintThumb(cv, t.hue, +cv.dataset.seed||7); }
    return;
  }
});
document.addEventListener("change", function(e){
  const el = e.target;
  if(el.dataset.act === "member-plan"){
    const m = State.members.find(x=>x.id===el.dataset.m);
    if(!m) return;
    if(!API.enabled){ m.plan = el.value; m.status = "active"; }
    saveMember("set_plan", { id:m.id, plan:el.value },
      m.name + " moved to " + PASS_NAME[el.value]);
  }
  if(el.dataset.act === "member-until"){
    const m = State.members.find(x=>x.id===el.dataset.m);
    if(!m) return;
    if(!API.enabled){ m.until = el.value; }
    saveMember("set_until", { id:m.id, until:el.value },
      "Access for " + m.name + " now runs to " + prettyDate(el.value));
  }
});

/* forms */
document.addEventListener("submit", async function(e){
  const f = e.target.closest("[data-form]");
  if(!f) return;
  e.preventDefault();

  if(f.dataset.form === "signin"){
    const email = $("#si-email").value.trim().toLowerCase();
    const pass  = $("#si-pass").value;
    if(API.enabled){
      try{
        const data = await apiPost("/auth.php?do=login", { email:email, password:pass });
        State.session = { role: data.user.role === "admin" ? "admin" : "disciple",
          name:data.user.name, email:data.user.email, plan:data.user.plan, until:data.user.accessUntil || "" };
        persist(); await loadContent();
        toast("Welcome back, " + String(data.user.name).split(" ")[0]);
        go(State.session.role === "admin" ? "#/admin" : "#/app");
      }catch(err){ toast(err.message || "That email and password do not match"); }
      return;
    }
    const m = State.members.find(x=>x.email.toLowerCase()===email);
    if(email === "admin@tgfm.org") return signInAs("admin");
    if(m) return signInAs(m.id);
    toast("No account with that email — subscribe to create one");
    location.hash = "#/pricing";
  }

  if(f.dataset.form === "claim"){
    const pass  = $("#ca-pass").value;
    const again = $("#ca-pass2").value;
    if(pass !== again){ toast("The two passwords do not match"); return; }
    claimAccount(f.dataset.ref, f.dataset.claim, $("#ca-name").value.trim(), pass);
  }
});

/* keyboard */
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && modal){ modal = null; render(); }
});

/* lifecycle */
window.addEventListener("hashchange", async function(){
  playing = false; State.ui.rail = false; State.ui.q = ""; modal = null;
  render();                   // paint immediately, so nothing feels stuck
  if(API.enabled){
    /* The receipt and create-account screens need a server round trip before
       they have anything true to show. */
    await preloadForRoute();
    render();
  }
});
window.addEventListener("resize", function(){
  clearTimeout(window.__rt);
  window.__rt = setTimeout(function(){ mountCanvases(document); if($("#heroCanvas")) paintHero($("#heroCanvas")); }, 180);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
  if(!document.documentElement.getAttribute("data-theme")) render();   // repaint canvas art
});

boot();
</script>

</body>
</html>
